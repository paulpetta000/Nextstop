  - "Pedamentina: chi la costruì e quando esattamente. Il Comune di Napoli non dà né data né costruttori; DMO Napoli dice 'XIV secolo' senza costruttori. Napolike.it (sito turistico privato, nessuna fonte citata) attribuisce l'opera a 'Tino di Campione e Francesco de Vito' e dice che serviva a scopi difensivi per Sant'Elmo: DUBBIO (il nome 'Tino di Campione' sembra confuso con Tino di Camaino), non usato nei fatti."
  - "Pedamentina: seconda fonte ufficiale per i 414 gradini (cercato su comune.napoli.it, cultura.gov.it, treccani; solo DMO Napoli, in inglese, lo dice)."
  - "Pedamentina: leggende o aneddoti (cercato su DMO Napoli e comune.napoli.it: nessuno)."
  - "Sant'Elmo: sito del museo (museinazionalivomero.cultura.gov.it) letto solo in home; storia estesa solo su cultura.gov.it. Date di eventi (terremoto 1456, fulmine alla polveriera 1587, Campanella 1604) presenti soltanto su Wikipedia inglese (pista, non usata)."
  - "San Martino: museosanmartino.cultura.gov.it non raggiungibile (dominio inesistente); la pagina FAI della Certosa non dà storia. Nessuna fonte ufficiale letta su Napoleone, la soppressione murattiana o il panorama."
  - "Via Toledo: la pagina del Comune IDPagina/5731 (ServeBLOB) dà 404; usata la versione articolo_tematico, che non parla di Chiavicone e architetti (quelli sono solo nel FAI)."
  - "Quartieri Spagnoli: pagina NapoliForMe del Comune vuota; pagina Comune 'Guida di Napoli al femminile' (IDPagina/4700) 404; Treccani su Pedro de Toledo non nomina i Quartieri. Trovati solo FAI e italia.it. Un passo del Comune sulle caserme dopo l'apertura di via Toledo compare solo in un risultato di ricerca, non letto."
  - "Stazione Toledo: il PDF del Comune (settembre 2012) è codificato e illeggibile; pagina Domus 403. Profondità: Metroart dice 40 m (hall); altre fonti non ufficiali (non lette per intero) dicono 38 m. Data di inaugurazione 17 settembre 2012 solo da POR FESR; Wikipedia dice 17 aprile."
