<title>Proposta Rivista</title>
<meta name="description" content="Proposta A per Nextstop: home, racconto «Due giorni a Napoli» e compositore, con i dati veri.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&display=swap">
<style>
/* Proposta A · «Rivista». Idea: Napoli come una rivista di viaggio stampata su pietra chiara (piperno e tufo),
   con le bande blu notte di MUDD, foto ritagliate ad arco come i portali delle chiese e i foglietti «da sapere» appoggiati.
   Titoli compatti in Archivo stretto, titoli dei racconti in Bodoni (carattere italiano), testo in Archivo. */
:root {
  --carta: #F7F6F2; --pietra: #ECEAE4; --pietra-2: #E1DED6; --riga: #D6D2C8;
  --inchiostro: #16181D; --inchiostro-2: #575B65;
  --notte: #142039; --su-notte: #F3F1EC; --su-notte-2: #B7BECC;
  --tufo: #E0A51B; --tufo-testo: #7A5600;
  --avviso: #FBEFD0; --su-avviso: #5E4300; --chiuso: #A8231B;
  --velo: rgba(10, 14, 26, .58);
  --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --serif: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif;
  --m100: 100ms; --m150: 150ms; --m200: 200ms; --m300: 300ms;
  --esci: cubic-bezier(0.7, 0, 0.84, 0); --entra: cubic-bezier(0.16, 1, 0.3, 1);
  --gutter: 20px; --largo: 72rem;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #0F1524; --pietra: #19223A; --pietra-2: #222D48; --riga: #2B3653;
    --inchiostro: #EEF0F4; --inchiostro-2: #A8AFBD;
    --notte: #080C17; --su-notte: #EEF0F4; --su-notte-2: #A8AFBD;
    --tufo: #F0BE3E; --tufo-testo: #F0BE3E;
    --avviso: #33290F; --su-avviso: #F6DA8E; --chiuso: #FF8F86;
    --velo: rgba(4, 6, 12, .66);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #0F1524; --pietra: #19223A; --pietra-2: #222D48; --riga: #2B3653;
  --inchiostro: #EEF0F4; --inchiostro-2: #A8AFBD;
  --notte: #080C17; --su-notte: #EEF0F4; --su-notte-2: #A8AFBD;
  --tufo: #F0BE3E; --tufo-testo: #F0BE3E;
  --avviso: #33290F; --su-avviso: #F6DA8E; --chiuso: #FF8F86;
  --velo: rgba(4, 6, 12, .66);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--carta); color: var(--inchiostro); font: 400 1.0625rem/1.55 var(--sans); font-variation-settings: "wdth" 100; padding-bottom: 88px; }
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
:focus-visible { outline: 3px solid var(--tufo); outline-offset: 3px; border-radius: 4px; }
.wrap { width: 100%; max-width: var(--largo); margin-inline: auto; padding-inline: var(--gutter); }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- Caratteri ---------- */
.titolone { font-family: var(--sans); font-weight: 800; font-variation-settings: "wdth" 70; letter-spacing: -0.015em; line-height: .92; }
.serif { font-family: var(--serif); font-weight: 600; font-optical-sizing: auto; letter-spacing: -0.01em; line-height: 1.05; }
.sezione__titolo { font-size: clamp(2rem, 7vw, 3.25rem); }
.piccolo { font-size: .875rem; line-height: 1.45; color: var(--inchiostro-2); }

/* ---------- Pulsanti ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 48px; padding: .75rem 1.375rem; border-radius: 999px;
  font: 600 1rem/1.2 var(--sans); text-decoration: none; border: 1.5px solid var(--inchiostro); color: var(--inchiostro); background: transparent; cursor: pointer;
  transition: transform var(--m100) var(--entra), background-color var(--m150) var(--entra), color var(--m150) var(--entra); }
.btn--pieno { background: var(--inchiostro); color: var(--carta); }
.btn:active { transform: scale(.97); }
@media (hover: hover) { .btn:hover { background: var(--inchiostro); color: var(--carta); } .btn--pieno:hover { background: var(--notte); border-color: var(--notte); color: var(--su-notte); } }
.su-notte .btn { border-color: var(--su-notte); color: var(--su-notte); }
.su-notte .btn--pieno { background: var(--su-notte); color: var(--notte); }

/* ---------- Testata e menu ---------- */
.testata { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--carta) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--riga); }
.testata__riga { display: flex; align-items: center; justify-content: space-between; min-height: 60px; }
.marchio { display: inline-flex; align-items: center; gap: .45rem; text-decoration: none; font: 800 1.375rem/1 var(--sans); font-variation-settings: "wdth" 72; letter-spacing: -.01em; }
.marchio__punto { width: .62rem; height: .62rem; border-radius: 50%; background: var(--tufo); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tufo) 30%, transparent); }
.tondo { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--riga); background: var(--carta); color: var(--inchiostro); cursor: pointer;
  transition: transform var(--m100) var(--entra); }
.tondo:active { transform: scale(.94); }
.tondo svg { width: 22px; height: 22px; }
.pagina--home .testata { position: absolute; inset-inline: 0; background: transparent; backdrop-filter: none; border-bottom: 0; color: #fff; }
.pagina--home .testata .tondo { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.35); color: #fff; backdrop-filter: blur(6px); }

.menu { position: fixed; inset: 0 0 0 auto; width: min(24rem, 88vw); height: 100dvh; max-height: none; margin: 0; padding: 0; border: 0; background: var(--notte); color: var(--su-notte);
  transform: translateX(100%); opacity: .6;
  transition: transform var(--m200) var(--esci), opacity var(--m200) var(--esci), overlay var(--m200) allow-discrete, display var(--m200) allow-discrete; }
.menu:popover-open { transform: none; opacity: 1; transition-duration: var(--m300); transition-timing-function: var(--entra); }
@starting-style { .menu:popover-open { transform: translateX(100%); opacity: .6; } }
.menu::backdrop { background: rgba(5, 8, 15, 0); transition: background-color var(--m300) var(--entra), overlay var(--m300) allow-discrete, display var(--m300) allow-discrete; }
.menu:popover-open::backdrop { background: rgba(5, 8, 15, .45); }
@starting-style { .menu:popover-open::backdrop { background: rgba(5, 8, 15, 0); } }
.menu__testa { display: flex; justify-content: space-between; align-items: center; min-height: 60px; padding-inline: var(--gutter); padding-top: env(safe-area-inset-top, 0px); }
.menu .tondo { background: transparent; color: var(--su-notte); border-color: rgba(255,255,255,.25); }
.menu nav { padding: 1rem var(--gutter) 2rem; display: grid; gap: 1.75rem; }
.menu__gruppo { display: grid; gap: .25rem; }
.menu__nome { font-family: var(--serif); font-size: 1.125rem; color: var(--su-notte-2); padding-bottom: .25rem; }
.menu a { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 48px; text-decoration: none; font: 700 1.5rem/1.1 var(--sans); font-variation-settings: "wdth" 72; border-bottom: 1px solid rgba(255,255,255,.12); }
.menu a[aria-current="page"]::after { content: ""; width: .55rem; height: .55rem; border-radius: 50%; background: var(--tufo); flex: none; }
.menu__piccoli a { font: 500 1rem/1.3 var(--sans); color: var(--su-notte-2); min-height: 44px; }
.menu li { list-style: none; opacity: 1; transform: none; transition: opacity var(--m300) var(--entra), transform var(--m300) var(--entra); transition-delay: calc(var(--i, 0) * 40ms); }
.menu ul { margin: 0; padding: 0; display: grid; }
@starting-style { .menu:popover-open li { opacity: 0; transform: translateX(16px); } }

/* ---------- HOME · apertura ---------- */
.apertura { position: relative; isolation: isolate; color: #fff; min-height: min(100svh, 52rem); display: flex; align-items: flex-end; overflow: hidden; background: #1b2232; }
.apertura__foto { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; animation: respira var(--m300) var(--entra) both; }
.apertura::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(8,12,22,.45) 0%, rgba(8,12,22,.12) 18%, rgba(8,12,22,.5) 40%, rgba(8,12,22,.86) 70%, rgba(8,12,22,.95) 100%); }
.apertura__dentro { padding-block: 7rem 1.5rem; display: grid; gap: 1.25rem; }
.apertura h1 { font-size: clamp(3.1rem, 15vw, 7.5rem); max-width: 11ch; text-shadow: 0 2px 24px rgba(0,0,0,.35); }
.apertura h1 span { display: block; }
.apertura__lead { font-size: 1.0625rem; line-height: 1.5; max-width: 34rem; color: rgba(255,255,255,.88); }
.apertura__credito { font-size: .75rem; color: rgba(255,255,255,.62); }
.apertura__credito a { color: inherit; }
@keyframes respira { from { transform: scale(1.04); } }
@keyframes sali { from { transform: translateY(10px); opacity: .01; } }
.apertura h1 span, .apertura__lead, .tempo { animation: sali var(--m300) var(--entra) both; }
.apertura h1 span:nth-child(2) { animation-delay: 80ms; }
.apertura__lead { animation-delay: 160ms; }
.tempo { animation-delay: 220ms; }

.tempo { display: grid; gap: .75rem; padding-top: .5rem; }
.tempo__titolo { font-family: var(--serif); font-size: 1.375rem; font-style: italic; }
.tempo__scelte { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; list-style: none; }
.scelta { display: inline-flex; align-items: center; gap: .55rem; min-height: 48px; padding: .5rem 1.05rem .5rem .55rem; border-radius: 999px; text-decoration: none;
  background: var(--su-notte); color: #12182A; font: 600 1rem/1 var(--sans); transition: transform var(--m100) var(--entra), background-color var(--m150) var(--entra); }
.scelta:active { transform: scale(.96); }
@media (hover: hover) { .scelta:hover { background: #fff; } }
.scelta__n { width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center; background: #12182A; color: #fff; font: 800 1rem/1 var(--sans); font-variation-settings: "wdth" 75; }
.scelta--tuo { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.75); padding-left: 1.05rem; }

/* ---------- HOME · come funziona ---------- */
.sezione { padding-block: clamp(3.5rem, 10vw, 6.5rem); }
.come { display: grid; gap: 2.5rem; }
.come__intro { display: grid; gap: .75rem; max-width: 36rem; }
.passi-box { position: relative; }
.passi { position: relative; display: grid; gap: 2.25rem; margin: 0; padding: 0 0 0 3.25rem; list-style: none; counter-reset: passo; }
.passi__linea { position: absolute; left: 0; top: .2rem; width: 2.5rem; height: calc(100% - .4rem); overflow: visible; }
.passi__linea path { fill: none; stroke: var(--tufo); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1 0; }
.passo { position: relative; display: grid; gap: .35rem; counter-increment: passo; }
.passo::before { content: counter(passo); position: absolute; left: -3.25rem; top: -.1rem; width: 2.5rem; height: 2.5rem; border-radius: 50%; display: grid; place-items: center;
  background: var(--carta); border: 2px solid var(--inchiostro); font: 800 1.05rem/1 var(--sans); font-variation-settings: "wdth" 75; }
.passo h3 { font-size: 1.5rem; }
.esempio { margin-top: .6rem; display: inline-grid; grid-template-columns: auto 1fr; gap: .15rem .75rem; align-items: center; padding: .85rem 1rem; border-radius: 14px; background: var(--pietra); font-size: .95rem; max-width: 26rem; }
.esempio__ora { font-weight: 700; }
.esempio__tratto { grid-column: 2; color: var(--inchiostro-2); font-size: .875rem; padding-block: .1rem; border-left: 2px dotted var(--tufo); padding-left: .65rem; margin-left: -.1rem; }
@media (prefers-reduced-motion: no-preference) {
  @supports ((animation-timeline: view()) and (animation-range: entry)) {
    .passi__linea path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: traccia linear both; animation-timeline: --passi; animation-range: entry 20% cover 62%; }
    .passi-box { view-timeline: --passi; }
    @keyframes traccia { to { stroke-dashoffset: 0; } }
  }
}

/* ---------- HOME · itinerari pronti ---------- */
.pronti__testa { display: flex; align-items: end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
.carosello { display: grid; grid-auto-flow: column; grid-auto-columns: min(78%, 20rem); gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: .75rem; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); scroll-padding-inline: var(--gutter); scrollbar-width: thin; }
@media (min-width: 900px) { .carosello { grid-auto-flow: row; grid-template-columns: repeat(4, 1fr); grid-auto-columns: auto; overflow: visible; margin-inline: 0; padding-inline: 0; } }
.scheda { scroll-snap-align: start; display: grid; gap: .65rem; text-decoration: none; }
.arco { border-radius: 999px 999px 14px 14px; overflow: hidden; aspect-ratio: 3 / 4; background: var(--pietra); }
.arco img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--m300) var(--entra); }
@media (hover: hover) { .scheda:hover .arco img { transform: scale(1.03); } }
.scheda:active .arco { transform: scale(.985); transition: transform var(--m100) var(--entra); }
.scheda h3 { font-size: 1.5rem; }
.scheda__dati { display: flex; flex-wrap: wrap; gap: .25rem .9rem; font-size: .9rem; color: var(--inchiostro-2); }
.scheda__dati b { color: var(--inchiostro); font-weight: 700; }

/* ---------- HOME · dove mangiare (banda notte) ---------- */
.su-notte { background: var(--notte); color: var(--su-notte); }
.mangiare { display: grid; gap: 2rem; }
@media (min-width: 900px) { .mangiare { grid-template-columns: 1fr 1.1fr; align-items: center; gap: 4rem; } }
.mangiare__foto { width: min(70%, 18rem); aspect-ratio: 1; margin-top: -6.5rem; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.mangiare__foto img { width: 100%; height: 100%; object-fit: cover; }
@media (min-width: 900px) { .mangiare__foto { margin-top: 0; width: 22rem; } }
.mangiare p { color: var(--su-notte-2); max-width: 32rem; }
.famiglie { margin: 1.25rem 0 0; padding: 0; list-style: none; border-top: 1px solid rgba(255,255,255,.16); }
.famiglie a { display: flex; justify-content: space-between; align-items: center; min-height: 56px; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,.16); font: 700 1.25rem/1.1 var(--sans); font-variation-settings: "wdth" 80; }
.famiglie span { font: 500 .9rem/1 var(--sans); color: var(--su-notte-2); }

/* ---------- HOME · perché fidarti (foglietti) ---------- */
.foglietti { display: grid; gap: 0; max-width: 34rem; margin-top: 2rem; }
@media (min-width: 900px) { .foglietti { grid-template-columns: repeat(2, 1fr); max-width: none; gap: 1.25rem; } }
.foglietto { background: var(--pietra); border-radius: 18px; padding: 1.5rem 1.4rem; font: 700 1.3rem/1.25 var(--sans); font-variation-settings: "wdth" 85; rotate: var(--r, -2deg); margin-top: -.6rem; box-shadow: 0 1px 0 var(--riga); }
.foglietto:nth-child(2) { --r: 1.6deg; background: var(--pietra-2); }
.foglietto:nth-child(3) { --r: -1deg; }
.foglietto:nth-child(4) { --r: 2.2deg; background: var(--pietra-2); }
.foglietto small { display: block; margin-top: .5rem; font: 400 .9rem/1.4 var(--sans); color: var(--inchiostro-2); }
@media (prefers-reduced-motion: no-preference) {
  @supports ((animation-timeline: view()) and (animation-range: entry)) {
    .foglietto { animation: appoggia linear both; animation-timeline: view(); animation-range: entry 0% entry 90%; }
    @keyframes appoggia { from { rotate: 0deg; transform: translateY(14px); } }
  }
}
.citta-dopo { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1rem; padding-block: 2.5rem; border-top: 1px solid var(--riga); }
.citta-dopo__linea { flex: 1 1 6rem; height: 0; border-top: 3px dotted var(--riga); }
.citta-dopo__fermata { width: 1.1rem; height: 1.1rem; border-radius: 50%; border: 3px solid var(--inchiostro-2); }

.piede { background: var(--pietra); padding-block: 2.5rem; font-size: .95rem; }
.piede__riga { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1.5rem; }
.piede ul { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; margin: 0; padding: 0; list-style: none; }
.piede a { display: inline-flex; min-height: 44px; align-items: center; }

/* ---------- RACCONTO ---------- */
.briciole { display: flex; flex-wrap: wrap; gap: .4rem; font-size: .9rem; color: var(--inchiostro-2); padding-top: 1.25rem; }
.briciole a { text-decoration: none; border-bottom: 1px solid var(--riga); }
.racconto__testa { display: grid; gap: 1.25rem; padding-block: 1rem 2.5rem; }
@media (min-width: 900px) { .racconto__testa { grid-template-columns: 1fr 1fr; align-items: end; gap: 3rem; } }
.racconto__arco { border-radius: 999px 999px 18px 18px; overflow: hidden; aspect-ratio: 4 / 5; max-height: 34rem; width: 100%; view-transition-name: foto-pronto; }
.racconto__arco img { width: 100%; height: 100%; object-fit: cover; }
.racconto h1 { font-size: clamp(2.6rem, 11vw, 5rem); line-height: .98; }
.racconto__lead { font-size: 1.125rem; line-height: 1.6; max-width: 36rem; }
.cifre { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: .25rem 1.75rem; margin: .25rem 0 0; }
.cifre div { display: grid; }
.cifre dt { order: 2; font-size: .85rem; color: var(--inchiostro-2); }
.cifre dd { margin: 0; font: 800 2rem/1 var(--sans); font-variation-settings: "wdth" 72; }
.azioni { display: flex; flex-wrap: wrap; gap: .6rem; }

.giorno__testa { padding-block: 2.75rem 2.25rem; }
.giorno__testa h2 { font-size: clamp(2.25rem, 9vw, 3.75rem); }
.giorno__testa p { margin-top: .75rem; color: var(--su-notte-2); max-width: 34rem; }
.linea-giorno { position: relative; padding-block: 2.5rem 1rem; }
.linea-giorno::before { content: ""; position: absolute; left: calc(var(--gutter) + 1.6rem); top: 2.5rem; bottom: 0; width: 0; border-left: 3px dotted var(--tufo); transform-origin: top; }
@media (min-width: 900px) { .linea-giorno::before { left: calc(50% - var(--largo) / 2 + var(--gutter) + 1.6rem); } }
@media (min-width: 72rem) { .linea-giorno::before { left: calc((100% - var(--largo)) / 2 + var(--gutter) + 1.6rem); } }
@media (max-width: 899px) { .linea-giorno::before { left: calc(var(--gutter) + 1.6rem); } }
@media (prefers-reduced-motion: no-preference) {
  @supports ((animation-timeline: view()) and (animation-range: entry)) {
    .linea-giorno::before { animation: scendi linear both; animation-timeline: view(); animation-range: entry 10% exit 40%; }
    @keyframes scendi { from { transform: scaleY(0); } }
  }
}
.tappa { position: relative; display: grid; grid-template-columns: 3.4rem 1fr; gap: 0 1rem; padding-bottom: 1.5rem; }
.tappa__ora { position: relative; z-index: 1; align-self: start; display: grid; place-items: center; width: 3.4rem; height: 3.4rem; border-radius: 50%; background: var(--carta); border: 2px solid var(--inchiostro); font: 800 .95rem/1 var(--sans); font-variation-settings: "wdth" 72; }
.tappa__corpo { display: grid; gap: .75rem; padding-top: .35rem; min-width: 0; max-width: 40rem; }
.tappa h3 { font-size: clamp(1.6rem, 6vw, 2.1rem); }
.etichette { display: flex; flex-wrap: wrap; gap: .4rem; }
.etichetta { display: inline-flex; align-items: center; min-height: 28px; padding: .2rem .65rem; border-radius: 999px; background: var(--pietra); font-size: .8rem; font-weight: 600; }
.etichetta--attenzione { background: var(--avviso); color: var(--su-avviso); }
.tappa__foto { border-radius: 999px 999px 14px 14px; overflow: hidden; aspect-ratio: 5 / 4; max-width: 30rem; }
.tappa:nth-of-type(even) .tappa__foto { border-radius: 14px; aspect-ratio: 16 / 10; }
.tappa__foto img { width: 100%; height: 100%; object-fit: cover; }
.tappa__foto figcaption { font-size: .75rem; color: var(--inchiostro-2); padding-top: .35rem; }
.tratto { display: grid; grid-template-columns: 3.4rem 1fr; gap: 0 1rem; padding-bottom: 1.5rem; font-size: .925rem; color: var(--inchiostro-2); }
.tratto span:last-child { padding-block: .2rem; }
.tratto b { color: var(--inchiostro); }
.dasapere { margin: .5rem 0 1.75rem 4.4rem; max-width: 30rem; background: var(--pietra); border-radius: 18px; padding: 1.25rem 1.3rem 1.3rem; rotate: -1.6deg; }
.dasapere:nth-of-type(2n) { rotate: 1.4deg; background: var(--pietra-2); }

    </div>
    <div class="carosello">
      ${pr.map(p => `<a class="scheda" href="#racconto">
        <div class="arco" ${p.id === 'due-giorni' ? 'style="view-transition-name: foto-pronto"' : ''}>${img(COPERTINE[p.id], '', 'loading="lazy"')}</div>
        <h3 class="serif">${esc(p.nome)}</h3>
        <p class="scheda__dati num"><span><b>${p.nTappe}</b> tappe</span><span><b>${p.minPiedi}</b> min a piedi</span></p>
      </a>`).join('')}
    </div>
  </section>

  <section class="su-notte sezione" aria-labelledby="h-mangiare" style="margin-top:5rem">
    <div class="wrap mangiare">
      <div class="mangiare__foto">${img('tp-pignasecca', null, 'loading="lazy"')}</div>
      <div>
        <h2 id="h-mangiare" class="serif sezione__titolo">Dove mangiare</h2>
        <p style="margin-top:.75rem">${C.locali} locali, dalla pizza a portafoglio al pesce sul lungomare. Ognuno entra nel tuo itinerario come pranzo, cena o spuntino.</p>
        <ul class="famiglie num">
          ${[['pizza', 'Pizzerie'], ['napoletana', 'Cucina napoletana'], ['pesce', 'Pesce'], ['strada', 'Cibo di strada'], ['dolci', 'Dolci e caffè']].map(([k, n]) => `<li><a href="#home">${n}<span>${C.cucine[k]} locali</span></a></li>`).join('')}
        </ul>
      </div>
    </div>
  </section>

  <section class="sezione wrap" aria-labelledby="h-fidarti">
    <h2 id="h-fidarti" class="serif sezione__titolo">Perché fidarti</h2>
    <div class="foglietti num">
      <p class="foglietto">${C.fonti} fonti, ognuna con il giorno del controllo.<small>Sono in fondo a ogni pagina.</small></p>
      <p class="foglietto">Orari e prezzi ricontrollati il ${D.aggiornato}.<small>Se una cosa non è sicura, lo scriviamo.</small></p>
      <p class="foglietto">Nessun link pagato, nessuna recensione comprata.</p>
      <p class="foglietto">Senza account. Funziona anche senza rete.</p>
    </div>
  </section>

  <div class="wrap"><p class="citta-dopo"><span>Napoli è la prima città. Le altre arrivano dopo.</span><span class="citta-dopo__linea" aria-hidden="true"></span><span class="citta-dopo__fermata" aria-hidden="true"></span></p></div>
  ${piede()}`;

  function piede() {
    return `<footer class="piede"><div class="wrap piede__riga">
      <span class="marchio"><span class="marchio__punto" aria-hidden="true"></span>Nextstop</span>
      <ul><li><a href="#racconto">Fonti</a></li><li><a href="#home">Privacy</a></li><li><a href="#home">Note legali</a></li><li><a href="#home">Accessibilità</a></li></ul>
    </div></footer>`;
  }

  /* ---------- RACCONTO ---------- */
  const P = pronto('due-giorni');
  const DOPO = { sansevero: 'tp-sansevero-prenota', duomo: 'tp-tesoro-durata', pedamentina: 'tp-pedamentina-orari', 'monte-echia': 'tp-echia-orari', 'borgo-marinari': 'tp-borgo-orari' };
  const LOCALE_DOPO = { tribunali: 'di-matteo' };
  const titoloGiorno = g => { const t = g.voci.filter(v => v.tipo === 'tappa'); return `Da ${T(t[0].id).breve} a ${T(t.at(-1).id).breve}`; };
  const piediGiorno = g => g.voci.filter(v => v.tipo === 'tratto' && !v.mezzi.length).reduce((s, v) => s + v.min, 0);
  let nFoto = 0;
  const vociGiorno = g => g.voci.map(v => {
    if (v.tipo === 'tratto') return `<p class="tratto num"><span></span><span>${tratto(v)}</span></p>`;
    const t = T(v.id), f = fotoTappa(v.id);
    const et = [`Visita: ${durata(v.fine - v.inizio)}`];
    const att = [];
    if (t.chiuso.length) att.push(`Chiuso ${t.chiuso.map(x => (x === 'dom' ? 'la ' : 'il ') + GIORNI[x]).join(' e ')}`);
    if (t.prenotazione === 'obbligatoria') att.push('Biglietto online obbligatorio');
    if (t.ingresso === 'gratis') et.push('Ingresso libero');
    const sapere = DOPO[v.id] ? `<aside class="dasapere"><h4>Da sapere</h4><p>${esc(D.schede[DOPO[v.id]].testo)}</p></aside>` : '';
    const loc = LOCALE_DOPO[v.id] ? (l => `<aside class="locale"><span class="locale__tipo">Per pranzo, qui</span><h4>${esc(l.nome)}</h4><p class="piccolo">${l.testo}</p></aside>`)(D.locali.find(l => l.id === LOCALE_DOPO[v.id])) : '';
    nFoto++;
    return `<article class="tappa">
      <span class="tappa__ora num">${ora(v.inizio)}</span>
      <div class="tappa__corpo">
        <h3 class="serif">${esc(t.nome)}</h3>
        <div class="etichette">${et.map(e => `<span class="etichetta">${e}</span>`).join('')}${att.map(e => `<span class="etichetta etichetta--attenzione">${e}</span>`).join('')}</div>
        ${f ? `<figure class="tappa__foto" style="margin:0">${img(f, null, 'loading="lazy"')}<figcaption>${credito(f)}</figcaption></figure>` : ''}
        <p>${t.testo}</p>
      </div>
    </article>${sapere}${loc}`;
  }).join('');

  $('#p-racconto').innerHTML = `
  <div class="wrap racconto">
    <nav class="briciole" aria-label="Percorso"><a href="#home">Napoli</a><span aria-hidden="true">›</span><a href="#home">Itinerari pronti</a><span aria-hidden="true">›</span><span aria-current="page">2 giorni</span></nav>
    <header class="racconto__testa">
      <div class="racconto__arco">${img('vista-monte-echia')}</div>
      <div style="display:grid;gap:1.25rem">
        <h1 class="serif">${esc(P.nome)}</h1>
        <p class="racconto__lead">${P.testo}</p>
        <dl class="cifre num"><div><dt>giorni</dt><dd>${P.giorni.length}</dd></div><div><dt>tappe</dt><dd>${P.nTappe}</dd></div><div><dt>min a piedi</dt><dd>${P.minPiedi}</dd></div></dl>
        <div class="azioni"><a class="btn btn--pieno" href="#compositore">Apri e cambialo</a><a class="btn" href="#compositore">Componi il tuo</a></div>
        <p class="piccolo">${credito('vista-monte-echia')}</p>
      </div>
    </header>
  </div>
  ${P.giorni.map((g, i) => `<section aria-labelledby="h-g${i}">
    <div class="su-notte"><div class="wrap giorno__testa"><h2 id="h-g${i}" class="serif">Giorno ${i + 1}</h2><p class="num">${esc(titoloGiorno(g))}: ${g.voci.filter(v => v.tipo === 'tappa').length} tappe, dalle ${ora(g.inizio)} alle ${ora(g.fine)}, ${piediGiorno(g)} minuti a piedi.</p></div></div>
    <div class="linea-giorno"><div class="wrap">${vociGiorno(g)}</div></div>
  </section>`).join('')}
  <section class="sezione wrap fine-racconto" aria-labelledby="h-fine">
    <h2 id="h-fine" class="serif sezione__titolo">Lo vuoi diverso?</h2>
    <p style="max-width:34rem">Aprilo nel compositore: sposti le tappe, cambi il giorno, aggiungi un pranzo. I tempi si ricalcolano da soli.</p>
    <div class="azioni"><a class="btn btn--pieno" href="#compositore">Apri e cambialo</a><a class="btn" href="#compositore">Componi il tuo</a></div>
  </section>
  <div class="wrap">
    <details class="fonti"><summary>Fonti di questa pagina</summary>
      <ol>${Object.values(D.fonti).map(f => `<li>${esc(f.titolo)}${f.editore ? `, ${esc(f.editore)}` : ''}. <a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.url.replace(/^https?:\/\//, ''))}</a></li>`).join('')}</ol>
    </details>
  </div>
  ${piede()}`;

  /* ---------- COMPOSITORE ---------- */
  const mart = D.martedi;
  const chiuse = new Set(mart.avvisi.filter(a => a.tipo === 'chiusa').map(a => a.id));
  let giornoScelto = 0;
  const dataLunga = '13 ottobre';
  const nomiChiuse = [...chiuse].map(id => T(id).breve);
  function giornata(g, gi) {
    const voci = P.giorni[g].voci;
    let n = 0;
    return voci.map(v => {
      if (v.tipo === 'tratto') return `<li class="spostamento num">${tratto(v)}</li>`;
      n++;
      const chiusa = gi === 0 && chiuse.has(v.id);
      return `<li><div class="voce ${chiusa ? 'voce--chiusa' : ''}">
        <button class="voce__maniglia" aria-label="Sposta ${esc(T(v.id).breve)}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></button>
        <span class="voce__n num">${n}</span>
        <span class="voce__testo"><span class="voce__nome">${esc(T(v.id).nome)}</span><span class="voce__ora num">${ora(v.inizio)}–${ora(v.fine)}</span>${chiusa ? `<span class="voce__chiusa">Chiuso il martedì</span>` : ''}</span>
        <button class="voce__piu" aria-label="Altre azioni per ${esc(T(v.id).breve)}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
      </div></li>`;
    }).join('');
  }
  function mappa(g, gi) {
    const ids = P.giorni[g].voci.filter(v => v.tipo === 'tappa').map(v => v.id);
    const pts = ids.map(id => T(id).xy);
    const fin = ids.map(id => T(id).xyFine ?? T(id).xy);
    const xs = [...pts, ...fin].map(p => p[0]), ys = [...pts, ...fin].map(p => p[1]);
    let x0 = Math.min(...xs) - 110, x1 = Math.max(...xs) + 110, y0 = Math.min(...ys) - 110, y1 = Math.max(...ys) + 110;
    const w = x1 - x0, h = y1 - y0, r = 0.8;
    if (h / w < r) { const d = (w * r - h) / 2; y0 -= d; y1 += d; } else { const d = (h / r - w) / 2; x0 -= d; x1 += d; }
    const linea = ids.map((id, i) => `${i ? 'L' : 'M'}${T(id).xy.join(' ')}${T(id).xyFine ? ` L${T(id).xyFine.join(' ')}` : ''}`).join(' ');
    const s = (x1 - x0) / 560;
    return `<svg viewBox="${x0} ${y0} ${x1 - x0} ${y1 - y0}" role="img" aria-label="Mappa del giorno ${g + 1}: ${ids.length} tappe">
      <rect class="mappa-terra" x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}"/>
      <path class="mappa-mare" d="${M.mare}"/><path class="mappa-terra" d="${M.isole}"/><path class="mappa-parchi" d="${M.parchi}"/>
      <g class="mappa-strade">${M.strade.map((d, i) => `<path d="${d}" stroke-width="${[7, 4, 2.4][i] * s}"/>`).join('')}</g>
      <path class="mappa-percorso" d="${linea}" style="stroke-width:${7 * s};stroke-dasharray:${2 * s} ${12 * s}"/>
      ${ids.map((id, i) => `<g class="mappa-fermata ${gi === 0 && chiuse.has(id) ? 'mappa-fermata--chiusa' : ''}" transform="translate(${T(id).xy.join(' ')}) scale(${s})"><circle r="20"/><text>${i + 1}</text></g>`).join('')}
    </svg>`;
  }
  function disegnaComp() {
    const g = P.giorni[giornoScelto];
    const fermate = g.voci.filter(v => v.tipo === 'tappa').length;
    $('#comp-giornata').innerHTML = giornata(giornoScelto, giornoScelto);
    $('#comp-riassunto').innerHTML = `<span><b>${ora(g.inizio)}–${ora(g.fine)}</b></span><span><b>${fermate}</b> tappe</span><span><b>${g.spostamenti}</b> min di spostamenti</span><span><b>${km(g.metri)}</b></span>`;
    $('#comp-avviso').hidden = giornoScelto !== 0;
    $('#comp-mappa').innerHTML = `${mappa(giornoScelto, giornoScelto)}<figcaption>Mappa: dati © i contributori di OpenStreetMap (ODbL). La linea collega le tappe in ordine.</figcaption>`;
    document.querySelectorAll('.schede-giorni button').forEach((b, i) => b.setAttribute('aria-selected', String(i === giornoScelto)));
    posizionaSegno();
  }
  function posizionaSegno() {
    const b = document.querySelectorAll('.schede-giorni button')[giornoScelto], s = $('.schede-giorni__segno');
    if (!b || !s) return;
    s.style.width = b.offsetWidth + 'px';
    s.style.transform = `translateX(${b.offsetLeft}px)`;
  }
  $('#p-compositore').innerHTML = `
  <div class="wrap comp">
    <nav class="briciole" aria-label="Percorso"><a href="#home">Napoli</a><span aria-hidden="true">›</span><span aria-current="page">Il tuo itinerario</span></nav>
    <div class="comp__testa">
      <h1 class="titolone">Il tuo itinerario</h1>
      <p class="nome-it"><span>${esc(P.nome)}</span><button aria-label="Cambia il nome"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button></p>
      <div class="controlli">
        <button class="pillola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Martedì ${dataLunga}</button>
        <button class="pillola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>9:30–19:00</button>
        <button class="pillola">Solo a piedi</button>
      </div>
    </div>
    <div class="schede-giorni" role="tablist" aria-label="Giorni"><span class="schede-giorni__segno" aria-hidden="true"></span>
      ${P.giorni.map((_, i) => `<button role="tab" aria-selected="${i === 0}" data-giorno="${i}">Giorno ${i + 1}</button>`).join('')}
    </div>
    <div class="avviso" id="comp-avviso" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></svg>
      <div><p>Martedì ${dataLunga} sono chiusi ${nomiChiuse.join(' e ')}.</p><button type="button">Cambia giorno</button></div>
    </div>
    <p class="riassunto num" id="comp-riassunto"></p>
    <div class="comp__griglia">
      <div>
        <ol class="giornata" id="comp-giornata"></ol>
        <button class="aggiungi" type="button" id="apri-foglio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Aggiungi una tappa</button>
        <div class="condividi"><button class="btn btn--pieno" type="button">Condividi il link</button><button class="btn" type="button">Salva sul telefono</button></div>
      </div>
      <figure class="comp__mappa" id="comp-mappa" style="margin:0"></figure>
    </div>
  </div>
  <div style="height:3rem"></div>
  ${piede()}`;
  document.querySelectorAll('.schede-giorni button').forEach(b => b.addEventListener('click', () => {
    const nuovo = +b.dataset.giorno;
    if (nuovo === giornoScelto) return;
    const vai = () => { giornoScelto = nuovo; disegnaComp(); };
    if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) { const vt = document.startViewTransition(vai); vt.ready.catch(() => {}); } else vai();
  }));
  disegnaComp();

  /* Ricerca nel foglio «Aggiungi una tappa» */
  const tutte = [
    ...Object.values(D.tappe).map(t => ({ id: t.id, nome: t.nome, sotto: t.tipo === 'gita' ? 'Gita fuori città' : t.zonaNome, tipo: t.tipo, cerca: `${t.nome} ${t.breve} ${t.zonaNome}` })),
    ...D.locali.map(l => ({ id: l.id, nome: l.nome, sotto: `${l.zonaNome}, da mangiare`, tipo: 'mangiare', cerca: `${l.nome} ${l.zonaNome} ${(l.cucina || []).join(' ')} ${(l.piatti || []).join(' ')}` }))
  ];
  const norma = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let filtro = 'tutto';
  function cerca() {
    const q = norma($('#cerca-campo').value.trim());
    const lista = tutte.filter(x => (filtro === 'tutto' || x.tipo === filtro) && (!q || norma(x.cerca).includes(q))).slice(0, 30);
    const segna = s => { if (!q) return esc(s); const i = norma(s).indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
    $('#risultati').innerHTML = lista.map((x, i) => `<li style="--i:${i}"><div><h3>${segna(x.nome)}</h3><p>${esc(x.sotto)}</p></div><button type="button" aria-label="Aggiungi ${esc(x.nome)}">+</button></li>`).join('');
    $('#vuoto').hidden = lista.length > 0;
    $('#risultati-conta').textContent = lista.length ? `${lista.length} risultati` : 'Nessun risultato';
  }
  $('#cerca-campo').addEventListener('input', cerca);
  document.querySelectorAll('.filtri button').forEach(b => b.addEventListener('click', () => {
    filtro = b.dataset.filtro;
    document.querySelectorAll('.filtri button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    cerca();
  }));
  $('#vuoto-tutto').addEventListener('click', () => { $('#cerca-campo').value = ''; filtro = 'tutto'; document.querySelectorAll('.filtri button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.filtro === 'tutto'))); cerca(); });
  $('#apri-foglio').addEventListener('click', () => { $('#cerca-campo').value = ''; cerca(); $('#foglio').showModal(); });
  $('#foglio-chiudi').addEventListener('click', () => $('#foglio').close());
  $('#foglio').addEventListener('click', e => { if (e.target === $('#foglio')) $('#foglio').close(); });

  /* ---------- Pagine della proposta e passaggio tra pagine ---------- */
  const PAGINE = ['home', 'racconto', 'compositore'];
  function mostra(nome, primo) {
    if (!PAGINE.includes(nome)) nome = 'home';
    const fai = () => {
      PAGINE.forEach(p => { document.getElementById('p-' + p).hidden = p !== nome; });
      document.querySelector('.pagina').className = `pagina pagina--${nome}`;
      document.querySelectorAll('.prova a').forEach(a => { if (a.getAttribute('href') === '#' + nome) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      document.querySelectorAll('#menu a[data-va]').forEach(a => { if (a.dataset.va === nome) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      window.scrollTo(0, 0);
      if (nome === 'compositore') requestAnimationFrame(posizionaSegno);
    };
    try { document.getElementById('menu').hidePopover(); } catch (e) {}
    if (!primo && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) { const vt = document.startViewTransition(fai); vt.ready.catch(() => {}); vt.finished.catch(() => {}); } else fai();
  }
  addEventListener('hashchange', () => mostra(location.hash.slice(1)));
  mostra(location.hash.slice(1) || 'home', true);
  addEventListener('resize', posizionaSegno);

  /* Tema: sistema → chiaro → scuro */
  const temi = [null, 'light', 'dark'], nomi = ['Tema: automatico', 'Tema: chiaro', 'Tema: scuro'];
  let t = 0;
  const imposta = () => { if (temi[t]) document.documentElement.dataset.theme = temi[t]; else delete document.documentElement.dataset.theme; $('#tema').setAttribute('aria-label', nomi[t]); $('#tema').title = nomi[t]; };
  try { const q = new URLSearchParams(location.search).get('tema'); if (q) { t = temi.indexOf(q); imposta(); } } catch (e) {}
  $('#tema').addEventListener('click', () => { t = (t + 1) % 3; imposta(); });
})();
</script>
