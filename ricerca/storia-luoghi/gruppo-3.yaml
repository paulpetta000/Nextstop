fatti:
  # ============ Castel Sant'Elmo (sant-elmo) ============
  - id: st-santelmo-belforte
    tappa: sant-elmo
    testo: "Le prime notizie sul castello risalgono al 1275: era una residenza fortificata degli Angioini, chiamata Belforte."
    fonti: [tp-mic-santelmo, st-santelmo-pnrr]
    citazione: "Le prime notizie risalgono al 1275, quando era una residenza fortificata angioina, denominata Belforte"
    leggenda: false
  - id: st-santelmo-roberto
    tappa: sant-elmo
    testo: "Nel 1329 il re Roberto d'Angiò ordinò di ampliarlo e affidò i lavori a Tino di Camaino."
    fonti: [tp-mic-santelmo]
    citazione: "Nel 1329, Roberto d'Angiò ordinò l'ampliamento, affidando i lavori a Tino di Camaino"
    leggenda: false
  - id: st-santelmo-nome
    tappa: sant-elmo
    testo: "Il nome viene da Sant'Erasmo: sul colle c'era una cappella dedicata a lui, e dal 1329 si parla di castrum Sancti Erasmi. Erasmo è diventato Ermo e poi Elmo."
    fonti: [st-santelmo-pnrr, st-santelmo-treccani-erasmo]
    citazione: "sorge dal 1329 il castrum Sancti Erasmi, per la presenza di una cappella dedicata a Sant'Erasmo"
    leggenda: false
    nota: "Il passaggio Sant'Ermo poi Sant'Elmo e' nel testo del MiC (viceregno spagnolo: chiamato poi Sant'Ermo e poi Sant'Elmo); Treccani: conserva il ricordo del santo nel nome del suo castello (Castel S. Elmo). Controllare la formulazione prima di scrivere."
  - id: st-santelmo-stella
    tappa: sant-elmo
    testo: "La pianta a stella a sei punte è del Cinquecento: la volle il viceré Pedro de Toledo e la ricostruzione durò dal 1537 al 1547. Il progetto è dell'ingegnere militare spagnolo Pedro Luis Escrivà."
    fonti: [tp-mic-santelmo, st-santelmo-opencampania]
    citazione: "L'attuale configurazione con l'impianto stellare a sei punte si deve invece alla ricostruzione cinquecentesca, voluta, tra il 1537 e il 1547, da Don Pedro de Toledo"
    leggenda: false
  - id: st-santelmo-escriva
    tappa: sant-elmo
    testo: "Escrivà descrisse il monte come aspro e frastagliato, e molti pensavano che un castello lassù fosse quasi impossibile da costruire."
    fonti: [st-santelmo-opencampania]
    citazione: "rugged and jagged ... practically impossible that it could be built"
    leggenda: false
    nota: "Pagina OpenCampania in inglese: la citazione e' la traduzione inglese; l'originale di Escrivà non e' stato letto. Da riverificare sulla pagina prima di usarlo."
  - id: st-santelmo-prigione
    tappa: sant-elmo
    testo: "Fu una prigione: ci furono rinchiusi Tommaso Campanella, accusato di eresia, e più tardi i patrioti della rivoluzione napoletana del 1799. Restò carcere militare fino al 1952."
    fonti: [tp-mic-santelmo]
    citazione: "vi furono rinchiusi Tommaso Campanella, accusato di eresia, e più tardi i patrioti della rivoluzione napoletana del 1799"
    leggenda: false
  - id: st-santelmo-1799
    tappa: sant-elmo
    testo: "Durante la rivolta di Masaniello (1647) fu rifugio del viceré; nel 1799 fu il centro della rivoluzione che portò alla Repubblica napoletana, proclamata dai giacobini in Castel Sant'Elmo il 24 gennaio 1799."
    fonti: [st-santelmo-opencampania, st-santelmo-treccani-napoli]
    citazione: "proclamata dai giacobini a N. in Castel S. Elmo, il 24 gennaio 1799"
    leggenda: false
  - id: st-santelmo-esplosione
    tappa: sant-elmo
    testo: "Un'esplosione distrusse molti edifici sulla Piazza d'Armi: furono ricostruiti tra il 1599 e il 1610."
    fonti: [st-santelmo-opencampania]
    citazione: "Un'esplosione distrusse molti edifici sulla Piazza d'Armi, che vennero ricostruiti tra il 1599 e il 1610."
    leggenda: false
    nota: "Dal riassunto dello strumento della pagina inglese. Il motivo dell'esplosione (fulmine nel 1587) e' solo su Wikipedia inglese: non usato."
  - id: st-santelmo-museo
    tappa: sant-elmo
    testo: "Dal 1976 ci furono grandi restauri; dal 2010 ospita il Museo Novecento. Oggi è sede anche della Direzione regionale Musei nazionali Campania."
    fonti: [tp-mic-santelmo]
    citazione: "A partire dal 1976 subì un imponente intervento di restauro ... il Museo Novecento, inaugurato nel 2010"
    leggenda: false

  # ============ Certosa e Museo di San Martino (san-martino) ============
  - id: st-sanmartino-fondazione
    tappa: san-martino
    testo: "La Certosa fu fondata nel 1325 da Carlo di Calabria, figlio del re Roberto d'Angiò. Il progetto era di Tino di Camaino: restano i grandiosi sotterranei gotici."
    fonti: [tp-mic-sanmartino]
    citazione: "fondata nel 1325 da Carlo di Calabria, figlio di re Roberto d'Angiò ... i grandiosi sotterranei gotici"
    leggenda: false
  - id: st-sanmartino-fanzago
    tappa: san-martino
    testo: "Dal 1623 al 1656 l'architetto Cosimo Fanzago trasformò il monastero gotico in un capolavoro barocco."
    fonti: [tp-mic-sanmartino, st-sanmartino-opencampania]
    citazione: "protagonista assoluto, tra 1623 e 1656, dell'evoluzione in senso barocco della Chiesa"
    leggenda: false
    nota: "OpenCampania parla della Chiesa; cultura.gov.it dice 'dal 1623 al 1656' e parla del monastero intero. Citare cultura.gov.it."
  - id: st-sanmartino-artisti
    tappa: san-martino
    testo: "Ci lavorarono pittori come Lanfranco, Ribera, Luca Giordano e Solimena, e scultori come Pietro Bernini e Giuseppe Sammartino."
    fonti: [tp-mic-sanmartino]
    citazione: "Giovanni Lanfranco, Jusepe de Ribera, Luca Giordano e Francesco Solimena ... Pietro Bernini e Giuseppe Sammartino"
    leggenda: false
  - id: st-sanmartino-chiostro
    tappa: san-martino
    testo: "Il Chiostro Grande, definito il cuore pulsante della vita monastica, fu ampliato dal 1581 da Giovanni Antonio Dosio e completato da Fanzago."
    fonti: [tp-mic-sanmartino]
    citazione: "cuore pulsante della vita monastica"
    leggenda: false
    nota: "La frase su Dosio dal 1581 e Fanzago e' riassunto dello strumento, non citazione diretta: riverificare."
  - id: st-sanmartino-museo
    tappa: san-martino
    testo: "Nel 1866, con la soppressione degli ordini religiosi, la Certosa fu trasformata in museo per volontà di Giuseppe Fiorelli; aprì al pubblico nel 1867."
    fonti: [tp-mic-sanmartino, st-sanmartino-opencampania]
    citazione: "la Certosa viene trasformata in museo per volontà di Giuseppe Fiorelli"
    leggenda: false
    nota: "1866 (trasformazione) e 1867 (apertura al pubblico come Museo Nazionale) sono in due fonti, non in contrasto."
  - id: st-sanmartino-cuciniello
    tappa: san-martino
    testo: "Il Presepe Cuciniello, inaugurato nel 1879, ha circa ottocento pezzi, disposti su uno scoglio diviso in tre scene: la Natività in un tempio romano in rovina, la taverna, l'annuncio ai pastori."
    fonti: [tp-mic-sanmartino, st-sanmartino-presepe]
    citazione: "Il celebre Presepe Cuciniello, inaugurato nel 1879, contiene circa ottocento pezzi"
    leggenda: false
  - id: st-sanmartino-luce
    tappa: san-martino
    testo: "Un impianto di luci simula l'alternarsi di alba, giorno, tramonto e notte. Michele Cuciniello (1825-1889), commediografo e architetto napoletano, lo donò al museo."
    fonti: [st-sanmartino-presepe]
    citazione: "L'opera è dotata di un impianto di illuminazione che simula l'alternarsi dell'alba, del giorno, del tramonto e della notte"
    leggenda: false

  # ============ Pedamentina (pedamentina) ============
  - id: st-pedamentina-antica
    tappa: pedamentina
    testo: "Di tutte le strade pedonali che scendono dal Vomero verso il centro, la Pedamentina è probabilmente una delle più antiche."
    fonti: [tp-comune-pedamentina]
    citazione: "Di tutte le strade pedonali che scendono dal Vomero verso il centro della città, la Pedamentina è probabilmente una delle più antiche."
    leggenda: false
  - id: st-pedamentina-percorso
    tappa: pedamentina
    testo: "Parte dal largo San Martino, davanti alla Certosa, scende per rampe e tornanti fino a corso Vittorio Emanuele e prosegue idealmente con le scale di Montesanto."
    fonti: [tp-comune-pedamentina]
    citazione: "attraverso una serie di rampe e tornanti fino a Corso Vittorio Emanuele, proseguendo idealmente per le scale di Montesanto"
    leggenda: false
  - id: st-pedamentina-gradini
    tappa: pedamentina
    testo: "Ha 414 gradini."
    fonti: [st-pedamentina-dmo]
    citazione: "414 steps of wonder"
    leggenda: false
    nota: "Una sola fonte ufficiale (DMO Napoli, in inglese). Il Comune (tp-comune-pedamentina) non dà il numero. Siti turistici ripetono 414: nessuna seconda fonte buona letta."
  - id: st-pedamentina-xiv
    tappa: pedamentina
    testo: "Fu costruita nel Trecento per collegare la Certosa alla città."
    fonti: [st-pedamentina-dmo]
    citazione: "Built in the 14th century to connect the Certosa to the city"
    leggenda: false
  - id: st-pedamentina-scorci
    tappa: pedamentina
    testo: "Scendendo si incontra una successione di scorci panoramici sul golfo."
    fonti: [tp-comune-pedamentina]
    citazione: "una successione di scorci panoramici mozzafiato"
    leggenda: false

  # ============ Via Toledo, Quartieri Spagnoli, stazione Toledo (toledo) ============
  # La tappa 'toledo' ha tre pezzi (strada, Quartieri, stazione): piu' di 7 fatti per poter scegliere.
  - id: st-toledo-1536
    tappa: toledo
    testo: "Via Toledo fu aperta nel 1536 dal viceré Don Pedro Alvarez de Toledo, marchese di Villafranca, come asse principale dell'espansione della città."
    fonti: [st-toledo-comune-aneddoti, st-toledo-touring-via]
    citazione: "era, infatti, il 1536 quando il viceré don Pedro Alvarez de Toledo, marchese di Villafranca, la inaugurò"
    leggenda: false
    nota: "DATE DIVERSE: il FAI (st-toledo-fai-via) dice 'tracciata nel 1540, resa percorribile nel '44 e completata nel '49'. Si puo' dire: aperta nel 1536 (Comune, Touring), lavori fino al 1549 (FAI)."
  - id: st-toledo-chiavicone
    tappa: toledo
    testo: "Fu costruita anche per coprire il Chiavicone, la fogna a cielo aperto che raccoglieva acque e scarichi della collina del Vomero. Gli architetti furono Giovanni Benincasa e Ferdinando Manlio."
    fonti: [st-toledo-fai-via]
    citazione: "per ricoprire il famigerato 'Chiavicone', la fogna a cielo aperto che raccogliendo le acque ed i liquami della collina del Vomero"
    leggenda: false
    nota: "Solo FAI (tipo altro). Il Comune non ne parla."
  - id: st-toledo-percorso
    tappa: toledo
    testo: "All'inizio andava da piazza Dante (allora piazza Mercatello) fino a piazza Trieste e Trento e al Plebiscito; oggi è lunga circa 2 km."
    fonti: [st-toledo-fai-via, st-toledo-touring-via]
    citazione: "andava dall'attuale piazza Dante (già pazza Mercatello) fino a Piazza Trieste e Trento e all'odierna Piazza del Plebiscito"
    leggenda: false
  - id: st-toledo-viaroma
    tappa: toledo
    testo: "Nel 1870 il sindaco Paolo Emilio Imbriani propose di chiamarla via Roma; si decise per «via Roma già via Toledo». In città girava la strofa «non mena a Roma ma mena ad Aversa». Il nome Toledo è tornato nel 1980."
    fonti: [st-toledo-comune-aneddoti, st-toledo-fai-via]
    citazione: "la strada si sarebbe chiamata 'via Roma già via Toledo'"
    leggenda: false
    nota: "Il 1980 (giunta Valenzi) e' solo nel FAI; la rima e' nel Comune."
  - id: st-toledo-sfogliatella
    tappa: toledo
    testo: "Al numero 275 c'è una pasticceria dove si dice che ai primi dell'Ottocento sia stata perfezionata la sfogliatella napoletana."
    fonti: [st-toledo-touring-via]
    citazione: "si dice che qui sia stata perfezionata ai primi dell'800 la sfogliatella napoletana"
    leggenda: true
    nota: "'Si dice': dato non verificato. CLAUDE.md vieta loghi/nomi di aziende: la fonte fa il nome (Pintauro), valutare se citarlo."
  - id: st-quartieri-soldati
    tappa: toledo
    testo: "I Quartieri Spagnoli nacquero nel Cinquecento: Don Pedro de Toledo li volle per ospitare i soldati spagnoli, incaricati di reprimere eventuali rivolte dei napoletani."
    fonti: [st-quartieri-fai, st-quartieri-italiait]
    citazione: "al fine di ospitare i suoi soldati che avevano il compito di reprimere eventuali ribellioni napoletane"
    leggenda: false
  - id: st-quartieri-truppe
    tappa: toledo
    testo: "I palazzi ospitavano anche le truppe spagnole dirette ad altri fronti di guerra, che facevano tappa a Napoli."
    fonti: [st-quartieri-fai]
    citazione: "le truppe spagnole dirette su altri fronti di guerra, che facevano tappa a Napoli"
    leggenda: false
  - id: st-quartieri-strade
    tappa: toledo
    testo: "Le strade dei Quartieri sono o parallele a via Toledo o salgono verso corso Vittorio Emanuele; l'origine spagnola resta nei nomi, come via Trinità degli Spagnoli."
    fonti: [st-quartieri-fai]
    citazione: "Le strade dei Quartieri Spagnoli sono o parallele a via Toledo o salgono in alto verso corso Vittorio Emanuele"
    leggenda: false
  - id: st-quartieri-montecalvario
    tappa: toledo
    testo: "Il quartiere è noto anche come Montecalvario, dal nome della chiesa di Santa Maria della Mercede a Montecalvario, fondata nel 1560."
    fonti: [st-quartieri-italiait]
    citazione: "noto anche come Montecalvario ... fondata nel 1560"
    leggenda: false
    nota: "Citazione abbreviata dal riassunto dello strumento: riverificare l'esatta frase sulla pagina."
  - id: st-metro-tusquets
    tappa: toledo
    testo: "La stazione Toledo è dell'architetto catalano Oscar Tusquets Blanca; è stata inaugurata il 17 settembre 2012."
    fonti: [st-toledo-porfesr, tp-anm-metroart-toledo, st-toledo-censimento]
    citazione: "17 settembre 2012 ... Óscar Tusquets Blanca"
    leggenda: false
    nota: "DATE DIVERSE: Metroart/ANM e scheda MiC dicono solo '2012'; POR FESR dice 17 settembre 2012; Wikipedia (non usabile come fonte) dice 17 aprile 2012. Usare il 17 settembre solo con la fonte POR FESR. Citazione riassunta dallo strumento."
  - id: st-metro-crater
    tappa: toledo
    testo: "Il «Crater de luz» è un grande cono che attraversa tutti i livelli e porta la luce dalla strada alla hall, 40 metri sottoterra."
    fonti: [tp-anm-metroart-toledo]
    citazione: "Un grande cono che attraversa in profondità tutti i livelli della stazione, collegando il piano della strada con la spettacolare hall costruita 40 metri sottoterra."
    leggenda: false
  - id: st-metro-colori
    tappa: toledo
    testo: "Scendendo il colore cambia: giallo caldo come il tufo, poi a quota 0, il livello del mare, i mosaici azzurri sempre più intensi man mano che si va in profondità."
    fonti: [tp-anm-metroart-toledo]
    citazione: "fino ad arrivare alla quota 0, il livello del mare, segnalato dal passaggio agli spettacolari mosaici di un azzurro che si fa sempre più intenso"
    leggenda: false
  - id: st-metro-mura
    tappa: toledo
    testo: "Al primo piano interrato si vedono i resti della cinta muraria di età aragonese."
    fonti: [tp-anm-metroart-toledo]
    citazione: "i resti della cinta muraria di età aragonese al primo piano interrato"
    leggenda: false
    nota: "Citazione riassunta dallo strumento (il testo dice che il progetto integra i resti): riverificare."
  - id: st-metro-artisti
    tappa: toledo
    testo: "Nella stazione ci sono due grandi mosaici di William Kentridge e le opere di luce di Robert Wilson, oltre a opere di Toscani, Weiner, Cevoli e Neshat."
    fonti: [tp-anm-metroart-toledo, st-toledo-censimento]
    citazione: "un grande mosaico di Kentridge inaugura la compresenza in un unico spazio di valori appartenenti alla storia della città e all'espressione contemporanea"
    leggenda: false
  - id: st-metro-premi
    tappa: toledo
    testo: "Il 30 novembre 2012 il Daily Telegraph la definì «la più impressionante d'Europa»; il 4 febbraio 2014 la CNN la elesse «la più bella d'Europa»."
    fonti: [st-toledo-porfesr]
