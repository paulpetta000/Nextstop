dubbi:
  - "Date diverse sulla nascita di Partenope: IX sec. a.C. (Comune, Cenni storici: mercanti anatolici e achei), VIII sec. a.C. (FAI, DMO, OpenCampania: Cumani), VII sec. a.C. (Treccani; Comune scheda Castel dell'Ovo: Cumani a meta' VII secolo). Meglio scrivere «quasi 2.500-3.000 anni fa» o riportare la discordanza."
  - "Galleria Umberto I: inaugurata nel 1890 (NapoliForMe) o nel 1892 (Italia.it). Cupola: 'alta 57 metri' (Italia.it) o 'ottagono di 36 metri' (NapoliForMe): sono misure diverse, non e' detto che si contraddicano. Progettista: Emanuele Rocco (Italia.it, Discover Campania); NapoliForMe cita solo Francesco Paolo Boubée (la cupola)."
  - "Castel dell'Ovo: Ruggero il Normanno 1140 (OpenCampania) contro 'forte noto al principio del sec. XII, accresciuto dai Normanni' (Treccani). Giovanna I: crollo nel 1370 solo per OpenCampania; Comune e FAI non danno l'anno."
  - "Statue del Palazzo Reale: la FAI e napolimisteriosa.it dicono 1888 e voluta da Umberto I; il Ministero della cultura dice solo 'ultimo decennio dell'Ottocento'. La FAI scrive anche che non c'e' nessun Borbone, ma nella sua stessa lista c'e' Carlo III (di Borbone): frase NON usata. Alfonso e' 'V d'Aragona' per la FAI, 'I d'Aragona' per altri (stesso re)."
  - "Statue equestri: italia.it (inglese) e FAI attribuiscono a Canova quella di Carlo III o di Ferdinando I; le due fonti non concordano su quale: dettaglio NON usato."
  - "Sirena Partenope: DMO dice che approdo' e mori' sulla roccia di Megaride; Treccani (voce Partenope) dice che le onde riportarono il corpo alle foci del Sebeto; Comune: 'da qui (Monte Echia) si vedeva la Sirena'. E' una leggenda con piu' versioni."
  - "I siti OpenCampania e DMO sono in inglese (le citazioni marcate EN lo sono). FAI e Treccani sono tipo 'altro' (non enti pubblici in senso stretto). Discover Campania: tipo 'altro' perche' non ho letto chi lo pubblica."
