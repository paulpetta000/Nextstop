<title>Proposta La linea</title>
<meta name="description" content="Proposta B per Nextstop: home, racconto «Due giorni a Napoli» e compositore, con i dati veri.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Proposta B · «La linea». Idea: ogni itinerario è una linea, come sulla mappa di una metro: un colore e un numero,
   le tappe sono fermate su una linea spessa, i tratti dicono quanti minuti e con che mezzo.
   Barlow Condensed (nato dai cartelli stradali) per titoli e numeri, Barlow per il testo. Mare e notte per le bande scure. */
:root {
  --fondo: #F2F4F3; --superficie: #FFFFFF; --riga: #D3DADE;
  --inchiostro: #0D1B26; --inchiostro-2: #4E5C67;
  --mare: #0B3954; --su-mare: #F2F7FA; --su-mare-2: #A6C0CF;
  --l-mezza: #F0B000; --l-uno: #D9402F; --l-due: #176FB0; --l-tre: #2C9757; --l-tuo: #0D1B26;
  --su-linea: #FFFFFF; --su-gialla: #0D1B26;
  --avviso: #FFF0C7; --su-avviso: #5A4300; --chiuso: #C42B20;
  --cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --sans: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --m100: 100ms; --m150: 150ms; --m200: 200ms; --m300: 300ms;
  --esci: cubic-bezier(0.7, 0, 0.84, 0); --entra: cubic-bezier(0.16, 1, 0.3, 1);
  --gutter: 20px; --largo: 72rem; --binario: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #07131C; --superficie: #0F202C; --riga: #213848;
    --inchiostro: #E7EEF2; --inchiostro-2: #9DAFBC;
    --mare: #03101A; --su-mare: #E7EEF2; --su-mare-2: #8FA9B9;
    --l-mezza: #FFC52E; --l-uno: #FF6A5C; --l-due: #4BA7EE; --l-tre: #4CC27A; --l-tuo: #E7EEF2;
    --su-linea: #07131C; --su-gialla: #07131C;
    --avviso: #382D0C; --su-avviso: #F6DA8E; --chiuso: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #07131C; --superficie: #0F202C; --riga: #213848;
  --inchiostro: #E7EEF2; --inchiostro-2: #9DAFBC;
  --mare: #03101A; --su-mare: #E7EEF2; --su-mare-2: #8FA9B9;
  --l-mezza: #FFC52E; --l-uno: #FF6A5C; --l-due: #4BA7EE; --l-tre: #4CC27A; --l-tuo: #E7EEF2;
  --su-linea: #07131C; --su-gialla: #07131C;
  --avviso: #382D0C; --su-avviso: #F6DA8E; --chiuso: #FF8A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fondo); color: var(--inchiostro); font: 400 1.0625rem/1.55 var(--sans); padding-bottom: 88px; }
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
:focus-visible { outline: 3px solid var(--l-due); outline-offset: 3px; border-radius: 4px; }
.wrap { width: 100%; max-width: var(--largo); margin-inline: auto; padding-inline: var(--gutter); }
.num { font-variant-numeric: tabular-nums; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.cond { font-family: var(--cond); font-weight: 700; letter-spacing: -.005em; line-height: .95; }
.titolo-sez { font-size: clamp(2.25rem, 9vw, 3.75rem); }
.piccolo { font-size: .875rem; line-height: 1.45; color: var(--inchiostro-2); }

/* Il segno di una linea: cerchio colorato con il numero */
.linea-segno { --c: var(--l-due); flex: none; width: 2.4rem; height: 2.4rem; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: var(--su-linea); font: 800 1.2rem/1 var(--cond); }
.linea-segno[data-l="mezza-giornata"] { --c: var(--l-mezza); color: var(--su-gialla); }
.linea-segno[data-l="un-giorno"] { --c: var(--l-uno); }
.linea-segno[data-l="due-giorni"] { --c: var(--l-due); }
.linea-segno[data-l="tre-giorni"] { --c: var(--l-tre); }
.linea-segno[data-l="tuo"] { --c: transparent; color: var(--inchiostro); box-shadow: inset 0 0 0 3px var(--l-tuo); }

/* ---------- Pulsanti ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 48px; padding: .7rem 1.3rem; border-radius: 12px;
  font: 600 1rem/1.2 var(--sans); text-decoration: none; border: 2px solid var(--inchiostro); color: var(--inchiostro); background: transparent; cursor: pointer;
  transition: transform var(--m100) var(--entra), background-color var(--m150) var(--entra), color var(--m150) var(--entra); }
.btn--pieno { background: var(--l-due); border-color: var(--l-due); color: var(--su-linea); }
.btn:active { transform: scale(.97); }
@media (hover: hover) { .btn:hover { background: var(--inchiostro); color: var(--fondo); } .btn--pieno:hover { background: var(--inchiostro); border-color: var(--inchiostro); } }
.su-mare .btn { border-color: var(--su-mare); color: var(--su-mare); }

/* ---------- Testata e menu ---------- */
.testata { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fondo); border-bottom: 1px solid var(--riga); }
.testata__riga { display: flex; align-items: center; justify-content: space-between; min-height: 60px; }
.marchio { display: inline-flex; align-items: center; gap: .5rem; text-decoration: none; font: 800 1.5rem/1 var(--cond); letter-spacing: .005em; }
.marchio__segno { width: 1.6rem; height: .8rem; position: relative; }
.marchio__segno::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--l-due); }
.marchio__segno::after { content: ""; position: absolute; right: -1px; top: 50%; width: .8rem; height: .8rem; margin-top: -.4rem; border-radius: 50%; background: var(--fondo); box-shadow: inset 0 0 0 3.5px var(--inchiostro); }
.pulsante-menu { display: inline-flex; align-items: center; gap: .55rem; min-height: 44px; padding: .35rem .9rem .35rem .75rem; border-radius: 12px; border: 2px solid var(--inchiostro); background: transparent; color: var(--inchiostro); font: 700 1rem/1 var(--sans); cursor: pointer; transition: transform var(--m100) var(--entra); }
.pulsante-menu:active { transform: scale(.96); }
.pulsante-menu svg { width: 20px; height: 20px; }

.menu { position: fixed; inset: 0; width: 100%; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--mare); color: var(--su-mare); overflow-y: auto;
  opacity: 0; transform: translateY(-12px);
  transition: opacity var(--m200) var(--esci), transform var(--m200) var(--esci), overlay var(--m200) allow-discrete, display var(--m200) allow-discrete; }
.menu:popover-open { opacity: 1; transform: none; transition-duration: var(--m300); transition-timing-function: var(--entra); }
@starting-style { .menu:popover-open { opacity: 0; transform: translateY(-12px); } }
.menu__testa { display: flex; justify-content: space-between; align-items: center; min-height: 60px; padding-top: env(safe-area-inset-top, 0px); }
.menu .pulsante-menu { border-color: var(--su-mare); color: var(--su-mare); }
.menu .marchio__segno::after { background: var(--mare); box-shadow: inset 0 0 0 3.5px var(--su-mare); }
.menu__mappa { position: relative; margin: 1.5rem 0 3rem; padding: 0; list-style: none; display: grid; }
.menu__mappa::before { content: ""; position: absolute; left: calc(1.2rem - var(--binario) / 2); top: 1.5rem; bottom: 1.5rem; width: var(--binario); border-radius: 3px; background: var(--l-due); transform-origin: top; transition: transform var(--m300) var(--entra); }
@starting-style { .menu:popover-open .menu__mappa::before { transform: scaleY(0); } }
.menu__mappa li { position: relative; opacity: 1; transform: none; transition: opacity var(--m300) var(--entra), transform var(--m300) var(--entra); transition-delay: calc(var(--i, 0) * 40ms); }
@starting-style { .menu:popover-open .menu__mappa li { opacity: 0; transform: translateX(-10px); } }
.menu__mappa a { display: flex; align-items: center; gap: 1rem; min-height: 56px; text-decoration: none; font: 700 1.75rem/1.05 var(--cond); }
.menu__mappa a::before { content: ""; flex: none; width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--mare); box-shadow: inset 0 0 0 5px var(--su-mare); transform: scale(.6); }
.menu__mappa .menu__citta { padding: 1rem 0 .25rem 3.4rem; font: 600 .95rem/1 var(--sans); color: var(--su-mare-2); }
.menu__mappa a[aria-current="page"]::before { transform: scale(.75); background: var(--su-mare); }
.menu__mappa .linea-segno { position: absolute; left: 0; top: .5rem; transform: none; }
.menu__mappa a.ha-segno::before { visibility: hidden; }
.menu__piccoli { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; padding: 0; margin: 0 0 2rem; list-style: none; }
.menu__piccoli a { display: inline-flex; align-items: center; min-height: 44px; color: var(--su-mare-2); }

/* ---------- Binario della home: si riempie mentre scorri ---------- */
.binario { position: relative; }
.binario::before, .binario::after { content: ""; position: absolute; left: calc(var(--gutter) + 1.2rem - var(--binario) / 2); top: 0; bottom: 0; width: var(--binario); border-radius: 3px; }
@media (min-width: 72rem) { .binario::before, .binario::after { left: calc((100% - var(--largo)) / 2 + var(--gutter) + 1.2rem - var(--binario) / 2); } }
.binario::before { background: var(--riga); }
.binario::after { background: var(--l-due); transform-origin: top; transform: scaleY(1); }
@media (prefers-reduced-motion: no-preference) {
  @supports ((animation-timeline: view()) and (animation-range: entry)) {
    .binario::after { animation: riempi linear both; animation-timeline: --binario; animation-range: cover 0% contain 100%; }
    .binario { view-timeline: --binario; }
    @keyframes riempi { from { transform: scaleY(0); } }
  }
}
.fermata { position: relative; padding-left: 3.6rem; }
.fermata__punto { position: absolute; z-index: 1; left: 0; top: .1rem; width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--fondo); box-shadow: inset 0 0 0 6px var(--inchiostro); }
.fermata__nome { font: 600 .95rem/1.2 var(--sans); color: var(--inchiostro-2); margin-bottom: .35rem; }

/* ---------- HOME · apertura ---------- */
.apertura { position: relative; isolation: isolate; background: var(--mare); color: var(--su-mare); overflow: hidden; }
.apertura__foto { position: relative; height: clamp(15rem, 44svh, 30rem); }
.apertura__foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; animation: avvicina var(--m300) var(--entra) both; }
.apertura__foto::after { content: ""; position: absolute; inset: auto 0 0 0; height: 45%; background: linear-gradient(transparent, var(--mare)); }
.apertura__credito { position: absolute; right: var(--gutter); top: 4.5rem; font-size: .7rem; color: rgba(255,255,255,.85); text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.apertura__credito a { color: inherit; }
.apertura__dentro { position: relative; margin-top: -5.5rem; padding-bottom: 2rem; display: grid; gap: 1rem; }
.cartello { display: inline-grid; justify-self: start; gap: .1rem; padding: .7rem 1.1rem .8rem; border-radius: 10px; background: var(--su-mare); color: var(--mare); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
.cartello__sopra { font: 600 .85rem/1 var(--sans); color: var(--inchiostro-2); }
.cartello h1 { font: 800 clamp(3.5rem, 19vw, 7rem)/.85 var(--cond); letter-spacing: -.01em; }
.apertura__lead { font-size: 1.125rem; max-width: 34rem; color: var(--su-mare-2); }
.apertura__lead b { color: var(--su-mare); font-weight: 600; }
@keyframes avvicina { from { transform: scale(1.05); } }
@keyframes sali { from { transform: translateY(10px); opacity: .01; } }
.cartello, .apertura__lead, .partenze { animation: sali var(--m300) var(--entra) both; }
.apertura__lead { animation-delay: 80ms; } .partenze { animation-delay: 160ms; }

/* Tabellone «Quanto tempo hai?» */
.partenze { margin-top: .5rem; border-radius: 16px; background: color-mix(in srgb, var(--su-mare) 7%, transparent); padding: .4rem 0; }
.partenze h2 { font: 700 1.5rem/1 var(--cond); padding: .8rem 1rem .5rem; }
.partenze ul { list-style: none; margin: 0; padding: 0; }
.partenza { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .9rem; min-height: 60px; padding: .55rem 1rem; text-decoration: none; border-top: 1px solid color-mix(in srgb, var(--su-mare) 12%, transparent);
  transition: background-color var(--m150) var(--entra); }
.partenza:active { background: color-mix(in srgb, var(--su-mare) 12%, transparent); }
@media (hover: hover) { .partenza:hover { background: color-mix(in srgb, var(--su-mare) 9%, transparent); } }
.partenza__nome { font: 700 1.35rem/1.05 var(--cond); }
.partenza__dati { font-size: .85rem; color: var(--su-mare-2); }
.partenza__freccia { width: 22px; height: 22px; transition: transform var(--m150) var(--entra); }
.partenza:active .partenza__freccia { transform: translateX(4px); }
.su-mare .linea-segno[data-l="tuo"], .apertura .linea-segno[data-l="tuo"] { color: var(--su-mare); box-shadow: inset 0 0 0 3px var(--su-mare); }

/* ---------- HOME · sezioni sul binario ---------- */
.tratto-home { padding-block: 3.5rem 1rem; display: grid; gap: 1.25rem; }
.passi { list-style: none; margin: 1rem 0 0; padding: 0; display: grid; gap: 2rem; }
.passi li { position: relative; padding-left: 3.6rem; }
.passi li::before { content: ""; position: absolute; left: .55rem; top: .2rem; width: 1.3rem; height: 1.3rem; border-radius: 50%; background: var(--fondo); box-shadow: inset 0 0 0 4px var(--l-due); }
.passi h3 { font: 700 1.6rem/1.05 var(--cond); margin-bottom: .25rem; }
.esempio { margin-top: .8rem; display: grid; grid-template-columns: auto auto 1fr; gap: .2rem .7rem; align-items: center; max-width: 24rem; padding: .9rem 1rem; border-radius: 14px; background: var(--superficie); border: 1px solid var(--riga); font-size: .95rem; }
.esempio__ora { font: 700 1.1rem/1 var(--cond); }
.esempio__pallino { width: .9rem; height: .9rem; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--l-due); }
.esempio__tratto { grid-column: 2 / 4; display: grid; grid-template-columns: .9rem 1fr; gap: .7rem; color: var(--inchiostro-2); font-size: .85rem; }
.esempio__tratto::before { content: ""; justify-self: center; width: 3px; height: 1.6rem; background: var(--l-due); border-radius: 2px; }

.linee { display: grid; gap: .9rem; margin-top: .5rem; }
@media (min-width: 900px) { .linee { grid-template-columns: repeat(2, 1fr); } }
.linea-scheda { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0; border-radius: 18px; overflow: hidden; background: var(--superficie); border: 1px solid var(--riga); text-decoration: none; transition: transform var(--m100) var(--entra); }
.linea-scheda:active { transform: scale(.985); }
.linea-scheda__foto { position: relative; }
.linea-scheda__foto img { width: 100%; height: 100%; object-fit: cover; min-height: 9rem; }
.linea-scheda__foto .linea-segno { position: absolute; left: .6rem; top: .6rem; box-shadow: 0 0 0 3px var(--superficie); }
.linea-scheda__testo { display: grid; align-content: center; gap: .4rem; padding: 1rem 1.1rem; min-width: 0; }
.linea-scheda h3 { font: 700 1.45rem/1.05 var(--cond); }
.linea-scheda__fermate { display: flex; align-items: center; gap: 0; margin-top: .2rem; }
.linea-scheda__fermate i { width: .7rem; height: .7rem; border-radius: 50%; box-shadow: inset 0 0 0 2.5px var(--c); flex: none; }
.linea-scheda__fermate b { flex: 1; height: 3px; background: var(--c); max-width: 1.4rem; }
.linea-scheda__dati { display: flex; flex-wrap: wrap; gap: .1rem .9rem; font-size: .875rem; color: var(--inchiostro-2); }
.linea-scheda__dati b { color: var(--inchiostro); }

.su-mare { background: var(--mare); color: var(--su-mare); }
.mangiare { padding-block: 3.5rem; display: grid; gap: 1.5rem; }
@media (min-width: 900px) { .mangiare { grid-template-columns: 1fr 1fr; align-items: start; gap: 3rem; } }
.mangiare__foto { border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 10; }
.mangiare__foto img { width: 100%; height: 100%; object-fit: cover; }
.mangiare p { color: var(--su-mare-2); }
.famiglie { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.25rem 0 0; padding: 0; list-style: none; }
.famiglie a { display: inline-flex; align-items: center; gap: .55rem; min-height: 44px; padding: .4rem .9rem; border-radius: 999px; text-decoration: none; background: color-mix(in srgb, var(--su-mare) 10%, transparent); font-weight: 600; transition: transform var(--m100) var(--entra); }
.famiglie a:active { transform: scale(.96); }
.famiglie span { font: 700 1.05rem/1 var(--cond); color: var(--su-mare-2); }

.cifre-home { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--riga); border: 1px solid var(--riga); border-radius: 18px; overflow: hidden; margin-top: .5rem; }
@media (min-width: 900px) { .cifre-home { grid-template-columns: repeat(4, 1fr); } }
.cifre-home div { background: var(--superficie); padding: 1.1rem 1rem; display: grid; gap: .3rem; align-content: start; }
.cifre-home b { font: 800 2.5rem/1 var(--cond); }
.cifre-home span { font-size: .9rem; color: var(--inchiostro-2); line-height: 1.35; }
.capolinea .fermata__punto { background: var(--inchiostro); box-shadow: inset 0 0 0 6px var(--inchiostro), 0 0 0 5px var(--fondo), 0 0 0 8px var(--inchiostro); }

.piede { background: var(--mare); color: var(--su-mare); padding-block: 2.5rem; font-size: .95rem; }
.piede .marchio__segno::after { background: var(--mare); box-shadow: inset 0 0 0 3.5px var(--su-mare); }
.piede__riga { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1.5rem; }
.piede ul { display: flex; flex-wrap: wrap; gap: .25rem 1.25rem; margin: 0; padding: 0; list-style: none; }
.piede a { display: inline-flex; min-height: 44px; align-items: center; color: var(--su-mare-2); }

/* ---------- RACCONTO ---------- */
.briciole { display: flex; flex-wrap: wrap; gap: .4rem; font-size: .9rem; color: var(--inchiostro-2); padding-top: 1.25rem; }
.briciole a { text-decoration: none; border-bottom: 1px solid var(--riga); }
.racconto__testa { display: grid; gap: 1.25rem; padding-block: 1rem 2.5rem; }
@media (min-width: 900px) { .racconto__testa { grid-template-columns: 1.1fr 1fr; align-items: end; gap: 3rem; } }
.racconto__foto { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 4 / 3; view-transition-name: foto-pronto; }
.racconto__foto img { width: 100%; height: 100%; object-fit: cover; }
.racconto__foto .linea-segno { position: absolute; left: 1rem; bottom: 1rem; width: 3.4rem; height: 3.4rem; font-size: 1.8rem; box-shadow: 0 0 0 4px var(--fondo); }
.racconto h1 { font: 800 clamp(3rem, 14vw, 5.5rem)/.9 var(--cond); }
.racconto__lead { font-size: 1.125rem; line-height: 1.6; max-width: 36rem; }
.cifre { display: flex; flex-wrap: wrap; gap: .5rem 1.75rem; margin: 0; }
.cifre div { display: grid; }
.cifre dt { order: 2; font-size: .85rem; color: var(--inchiostro-2); }
.cifre dd { margin: 0; font: 800 2.4rem/1 var(--cond); }
.azioni { display: flex; flex-wrap: wrap; gap: .6rem; }
.giorno__testa { padding-block: 2rem; display: flex; align-items: center; gap: 1rem; }
.giorno__testa .linea-segno { width: 3.2rem; height: 3.2rem; font-size: 1.35rem; }
.giorno__testa h2 { font: 800 clamp(2rem, 8vw, 3rem)/.95 var(--cond); }
.giorno__testa p { color: var(--su-mare-2); font-size: .95rem; margin-top: .3rem; }
.percorso { --c: var(--l-due); position: relative; padding-block: 2rem 1rem; }
.fila { position: relative; display: grid; grid-template-columns: 3.6rem 2.4rem 1fr; gap: 0 .9rem; }
.fila__ora { font: 700 1.3rem/1 var(--cond); text-align: right; padding-top: .55rem; }
.fila__binario { position: relative; display: flex; justify-content: center; }
.fila__binario::before { content: ""; position: absolute; top: 0; bottom: 0; width: var(--binario); background: var(--c); }
.fila--prima .fila__binario::before { top: 1.2rem; }
.fila--ultima .fila__binario::before { bottom: auto; height: 1.2rem; }
.fila__punto { position: relative; z-index: 1; width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--fondo); box-shadow: inset 0 0 0 6px var(--c); }
.fila--ultima .fila__punto { background: var(--c); box-shadow: inset 0 0 0 6px var(--c), 0 0 0 4px var(--fondo), 0 0 0 7px var(--c); }
.fila__corpo { display: grid; gap: .75rem; padding: .35rem 0 2rem; min-width: 0; max-width: 40rem; }
.fila h3 { font: 700 clamp(1.7rem, 7vw, 2.2rem)/1 var(--cond); }
@media (prefers-reduced-motion: no-preference) {

  const GIORNI = { lun: 'lunedì', mar: 'martedì', mer: 'mercoledì', gio: 'giovedì', ven: 'venerdì', sab: 'sabato', dom: 'domenica' };
  const T = id => D.tappe[id];

  const img = (id, alt, attr = '') => F[id] ? `<img src="${F[id]}" alt="${esc(alt ?? D.crediti[id]?.alt ?? '')}" ${attr}>` : '';
  const credito = id => { const c = D.crediti[id]; return c ? `Foto: ${esc(c.autore)}, <a href="${esc(c.fonte)}" target="_blank" rel="noopener">${esc(c.licenza)}</a>` : ''; };
  const PIEDI = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4.5" r="1.8"/><path d="M10 21l2-6 3 3v3M9 12l2-4 4 1 2 3M11 8l-1 5"/></svg>';

  /* Ricerca nel foglio «Aggiungi una tappa» */
  const tutte = [
    ...Object.values(D.tappe).map(t => ({ id: t.id, nome: t.nome, sotto: t.tipo === 'gita' ? 'Gita fuori città' : t.zonaNome, tipo: t.tipo, cerca: `${t.nome} ${t.breve} ${t.zonaNome}` })),
    ...D.locali.map(l => ({ id: l.id, nome: l.nome, sotto: `${l.zonaNome}, da mangiare`, tipo: 'mangiare', cerca: `${l.nome} ${l.zonaNome} ${(l.cucina || []).join(' ')} ${(l.piatti || []).join(' ')}` }))
  ];
  const norma = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let filtro = 'tutto';
  function cerca() {
    const q = norma($('#cerca-campo').value.trim());
    const lista = tutte.filter(x => (filtro === 'tutto' || x.tipo === filtro) && (!q || norma(x.cerca).includes(q))).slice(0, 30);
    const segna = s => { if (!q) return esc(s); const i = norma(s).indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length)); };
    $('#risultati').innerHTML = lista.map((x, i) => `<li style="--i:${i}"><span class="risultati__tipo" data-t="${x.tipo}" aria-hidden="true"></span><div><h3>${segna(x.nome)}</h3><p>${esc(x.sotto)}</p></div><button type="button" aria-label="Aggiungi ${esc(x.nome)}">+</button></li>`).join('');
    $('#vuoto').hidden = lista.length > 0;
    $('#risultati-conta').textContent = lista.length ? `${lista.length} risultati` : 'Nessun risultato';
  }
  function apriFoglio() { $('#cerca-campo').value = ''; cerca(); $('#foglio').showModal(); }
  $('#cerca-campo').addEventListener('input', cerca);
  document.querySelectorAll('.filtri button').forEach(b => b.addEventListener('click', () => {
    filtro = b.dataset.filtro;
    document.querySelectorAll('.filtri button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    cerca();
  }));
  $('#vuoto-tutto').addEventListener('click', () => { $('#cerca-campo').value = ''; filtro = 'tutto'; document.querySelectorAll('.filtri button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.filtro === 'tutto'))); cerca(); });
  $('#foglio-chiudi').addEventListener('click', () => $('#foglio').close());
  $('#foglio').addEventListener('click', e => { if (e.target === $('#foglio')) $('#foglio').close(); });
  disegnaComp();

  /* ---------- Pagine della proposta e passaggio tra pagine ---------- */
  const PAGINE = ['home', 'racconto', 'compositore'];
  function mostra(nome, primo) {
    if (!PAGINE.includes(nome)) nome = 'home';
    const fai = () => {
      PAGINE.forEach(p => { document.getElementById('p-' + p).hidden = p !== nome; });
      document.querySelector('.pagina').className = `pagina pagina--${nome}`;
      document.querySelectorAll('.prova a').forEach(a => { if (a.getAttribute('href') === '#' + nome) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      document.querySelectorAll('#menu a[data-va]').forEach(a => { if (a.dataset.va === nome) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      window.scrollTo(0, 0);
    };
    try { document.getElementById('menu').hidePopover(); } catch (e) {}
    if (!primo && document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) { const vt = document.startViewTransition(fai); vt.ready.catch(() => {}); vt.finished.catch(() => {}); } else fai();
  }
  addEventListener('hashchange', () => mostra(location.hash.slice(1)));
  mostra(location.hash.slice(1) || 'home', true);

  /* Tema: sistema → chiaro → scuro */
  const temi = [null, 'light', 'dark'], nomi = ['Tema: automatico', 'Tema: chiaro', 'Tema: scuro'];
  let t = 0;
  const imposta = () => { if (temi[t]) document.documentElement.dataset.theme = temi[t]; else delete document.documentElement.dataset.theme; $('#tema').setAttribute('aria-label', nomi[t]); $('#tema').title = nomi[t]; };
  try { const q = new URLSearchParams(location.search).get('tema'); if (q) { t = temi.indexOf(q); imposta(); } } catch (e) {}
  $('#tema').addEventListener('click', () => { t = (t + 1) % 3; imposta(); });
})();
</script>
