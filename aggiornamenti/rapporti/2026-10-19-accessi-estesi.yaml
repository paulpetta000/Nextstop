  canali:
  - comune-notizie
  - gestore-www-comune-napoli-it
  cosa_controllare: Orari attuali, giorni chiusi, ultimo ingresso e nuove comunicazioni. Cercare sul sito del Comune
    una pagina successiva a quella salvata.
  contesto: 403 sul portale principale; biglietteria ufficiale alternativa restituisce ciclo di reindirizzamenti.
    Carta dei servizi accessibile ma non sufficiente per gli orari.
  risposta_enrico: null
  nuovo_esito: resta_da_verificare
  riscontro_nuovo: 'Confermare calendario attuale e avvisi straordinari del Comune: scheda Artecard accessibile,
    validità non esplicita. Anche il portale generale delle notizie resta bloccato.'
  fonti_nuove:
  - url: https://www.campaniartecard.it/tour-item/museo-civico-di-castelnuovo/?lang=en
    nota: 'Scheda inglese Artecard leggibile, con orari e chiusura domenicale. Nessuna data esplicita di efficacia:
      verificare avvisi recenti del Comune.'
  fonti_alternative_precedenti: []
- id: V04
  titolo: 'ANM: ascensori, Monte Echia e avvisi'
  stato: da_controllare
  url_originari:
  - https://www2.anm.it/index.php?option=com_content&task=view&id=1339&Itemid=320
  - https://www2.anm.it/index.php?option=com_content&task=view&id=4286&Itemid=314
  - https://www.anm.it/s/?language=it
  - https://www.anm.it/s/funicolari?language=it
  fonti:
  - tp-anm-ascensori
  - tp-anm-echia
  canali:
  - anm-portale
  - anm-funicolari
  cosa_controllare: Verificare orari feriali/festivi di ciascun ascensore, servizio di Monte Echia, tariffa e avvisi
    recenti di guasti o sospensioni; conservare URL della pagina effettivamente letta.
  contesto: Vecchie schede non leggibili; nuovo portale restituisce solo struttura JavaScript. Metroart e Carta
    della mobilità 2025 accessibili, ma non sostituiscono gli avvisi correnti.
  risposta_enrico: null
  nuovo_esito: resta_da_verificare
  riscontro_nuovo: Verificare avvisi e orari 2026 dei singoli ascensori, Monte Echia e funzionamento impianti Ventaglieri.
    Il PDF recuperato dichiara dati 2024.
  fonti_nuove:
  - url: https://www.anm.it/resource/1768990802000/cartadellamobilita25
    nota: 'Carta della mobilità 2025: la sezione a pagina PDF 30 dichiara esplicitamente orari in vigore per il
      2024. Contiene ascensori e Monte Echia, ma NON certifica il servizio 2026.'
  fonti_alternative_precedenti: []
- id: V05
  titolo: Borgo Marinari e Castel dell’Ovo
  stato: da_controllare
  url_originari:
  - https://www.comune.napoli.it/articolo_tematico/trasporti-mobilita/ztl-e-aree-pedonali/area-pedonale-di-borgo-marinari/
  - https://www.comune.napoli.it/casteldellovo
  fonti:
  - tp-comune-borgomarinari
  - tp-comune-casteldellovo
  canali: []
  cosa_controllare: 'Distinguere accesso all’area pedonale e accesso al castello: verificare eventuale chiusura
    per lavori e comunicazione recente di riapertura.'
  contesto: 'Comune 403. Scheda MiC con orari leggibile: non basta a dimostrare la riapertura del castello.'
  risposta_enrico: null
  nuovo_esito: resta_da_verificare
  riscontro_nuovo: Resta da accertare la situazione attuale dell’area pedonale e del castello dopo i lavori; scheda
    MiC già leggibile non prova riapertura.
  fonti_nuove: []
  fonti_alternative_precedenti:
  - *id001
- id: V06
  titolo: Villa Comunale
  stato: da_controllare
  url_originari:
  - https://www.comune.napoli.it/vivere-il-comune/luoghi/villa-comunale/
  fonti:
  - tp-comune-villacomunale
  canali: []
  cosa_controllare: Verificare orari stagionali validi nel periodo del viaggio, chiusure e ingressi utilizzabili.
  contesto: 'NapoliForMe accessibile; tabella settimanale senza decorrenza. Esiste anche prospetto comunale annuale
    storico: confermare quale sia attuale.'
  risposta_enrico: null
  nuovo_esito: fonte_e_orario_ordinario_recuperati
  riscontro_nuovo: Fonte dell’orario ordinario recuperata nell’ordinanza del 22/07/2025. Eventuali avvisi successivi
    rientrano nel normale controllo periodico; nessuna ulteriore apertura manuale del vecchio URL necessaria per
    leggere la regola ordinaria.
  fonti_nuove:
  - url: https://static-www.comune.napoli.it/wp-content/uploads/2025/09/allegato1753165813.pdf
    nota: Ordinanza sindacale del 22/07/2025, ORDSI/2025/0000840, immediatamente esecutiva, sostituisce i provvedimenti
      in contrasto. Calendari distinti per parchi centrali e Villa Comunale/Virgiliano; regole di chiusura per allerta.
      Da incrociare con avvisi successivi, non col vecchio prospetto preso da solo.
  fonti_alternative_precedenti:
  - url: https://napoliforme.comune.napoli.it/en/pois/-/poi/Villa-Comunale
    nota: Scheda del portale turistico istituzionale leggibile; orario settimanale presente ma manca una decorrenza
      esplicita. Verificare stagionalità con prospetto comunale.
    parziale: true
- id: V07
  titolo: Villa Floridiana e Museo Duca di Martina
  stato: da_controllare
  url_originari:
  - https://cultura.gov.it/luogo/museo-della-ceramica-duca-di-martina-in-villa-floridiana
  fonti:
  - tp-mic-floridiana
  canali: []
  cosa_controllare: Orari distinti di parco e museo, giorno di chiusura, ultimo ingresso ed eventuali variazioni
    dal luglio 2026; trovare pubblicazione corrente del gestore.
  contesto: Pagina MiC in timeout; nuovo sito Musei nazionali del Vomero leggibile ma nella pagina aperta presenta
    i luoghi e i contatti, senza orari. Avvisi di singole festività non valgono come calendario ordinario.
  risposta_enrico: null
  nuovo_esito: fonte_e_orario_ordinario_recuperati
  riscontro_nuovo: 'Fonte e orari ordinari distinti di museo e parco recuperati. Conservare il riscontro: il sito
    è intermittente. Ricerca di futuri avvisi nel normale controllo periodico.'
  fonti_nuove:
  - url: https://cultura.gov.it/index.php/luogo/museo-della-ceramica-duca-di-martina-in-villa-floridiana
    nota: 'Scheda MiC aperta una volta con contenuto completo utile, poi in timeout: accesso intermittente. Aggiornata
      il 06/08/2026; distingue museo, parco stagionale e ultimo ingresso.'
  fonti_alternative_precedenti: []
