versione: 1
data: '2026-10-19'
tipo: ritentativo_accesso_fonti
commit_precedente: 2e65a01b5cf8d5cb3a798981fbce6dcc26aba545
ambito: 50 URL segnalati non verificabili nel rapporto iniziale; accessi alternativi e verifiche personali residue.
metodi:
- Nuova apertura dei 50 URL tramite servizio web.
- Ricerche mirate sui domini ufficiali, confronto di percorsi pubblici, www e senza www, lingua italiana e query
  menu ANM.
- Lettura di pagine alternative e testo di PDF ufficiali; due richieste screenshot PDF non hanno restituito immagini
  e non sono considerate verifica visiva.
- 'Prova terminale tramite proxy configurato: proxy non raggiungibile.'
- 'Prova browser Chromium/Playwright: arresto del browser prima della navigazione. Nessuna verifica del sito ottenuta
  da questo metodo.'
limiti:
- 'Il servizio web può usare contenuti indicizzati: data del tentativo distinta da data di scansione e da validità.'
- 403, 404, timeout, controllo di sicurezza e contenuto JavaScript sono risultati diversi; nessun aggiramento di
  CAPTCHA o protezioni.
- Aprire la scheda di un PDF non equivale a leggere e confrontare tutte le sue corse.
- Una homepage recuperata non certifica tutti gli orari o gli avvisi del gestore.
