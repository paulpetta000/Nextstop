<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Telefono</title>
<style>html,body{margin:0;background:#555}iframe{display:block;border:0;background:#fff}</style></head>
<body><iframe id="f"></iframe>
<script>
// Mostra una proposta dentro una cornice larga come un telefono (Chrome senza finestra non scende sotto i 500 px).
// ?p=proposta-a&w=390&h=3000&t=light&g=home
const q = new URLSearchParams(location.search), f = document.getElementById('f');
f.width = q.get('w') || 390; f.height = q.get('h') || 3000;
f.src = `${q.get("p") || "proposta-a"}.html?tema=${q.get("t") || "light"}&colore=${q.get("c") || ""}&s=${q.get("s") || ""}&v=${q.get("v") || ""}#${q.get("g") || "home"}`;
</script></body></html>
