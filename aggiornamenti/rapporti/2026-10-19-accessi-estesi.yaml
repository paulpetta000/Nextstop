  fonti:
  - tp-comune-pedamentina
  canali: []
  cosa_controllare: Verificare se il percorso pubblico presenta oggi chiusure, cantieri o tratti non percorribili.
    Non attribuire un orario a una strada pubblica senza fonte.
  contesto: Scheda Comune non leggibile e nessuna alternativa ufficiale recente sufficiente.
  risposta_enrico: null
  nuovo_esito: resta_da_verificare
  riscontro_nuovo: Resta da trovare una comunicazione ufficiale utile su percorribilità, lavori o chiusure della
    Pedamentina; non assegnare orari a una strada senza fonte.
  fonti_nuove: []
  fonti_alternative_precedenti: []
- id: V09
  titolo: 'Marechiaro: ZTL e accesso'
  stato: da_controllare
  url_originari:
  - https://www.comune.napoli.it/articolo_tematico/trasporti-mobilita/ztl-e-aree-pedonali/ztl-marechiaro/
  fonti:
  - tp-comune-ztl-marechiaro
  canali: []
  cosa_controllare: Controllare ordinanza vigente e date/fasce della ZTL, distinguendo accesso ai veicoli e passaggio
    pedonale.
  contesto: 403 su scheda ZTL e indice ufficiale alternativo. Non usare ordinanze vecchie come prova attuale.
  risposta_enrico: null
  nuovo_esito: resta_da_verificare
  riscontro_nuovo: Il dispositivo 2026 è recuperato; resta da chiarire l’eventuale attivazione effettiva in ottobre
    o atti successivi, considerando la clausola e la data discordante nel documento.
  fonti_nuove:
  - url: https://static-www.comune.napoli.it/wp-content/uploads/2025/05/allegato1777550695.pdf
    nota: 'Ordinanza dirigenziale n.21 del 30/04/2026 (OD/2026/0000725), letta nelle parti operative. Periodi fino
      al 27/09/2026; clausola di possibile attivazione in ottobre e un riferimento discordante al 2025: non dedurre
      automaticamente ZTL inattiva oggi.'
  fonti_alternative_precedenti: []
- id: V10
  titolo: Parco Virgiliano
  stato: da_controllare
  url_originari:
