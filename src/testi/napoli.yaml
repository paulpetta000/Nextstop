# Testi della pagina /napoli/ (provvisoria, 06/10/2026).

intro:
  senzaFonte: "Presentazione della pagina: dice cosa c'è, nessuna informazione da controllare"
  testo: |
    Napoli si gira a piedi, in metropolitana e in funicolare. Qui trovi gli itinerari, da mezza giornata a tre giorni o fatti da te, e i locali dove fermarti a mangiare. Orari e prezzi delle tappe vengono dai siti ufficiali, ognuno con la data del controllo.
