versione: 1
data: '2026-10-19'
tipo: riesame_esteso_accessi_e_vecchia_lista
commit_precedente: 2880d9694b49efcbd0434ecefb6ce3a2c5a1169f
definizioni:
  indirizzo_originario: URL distinto fra i 50 del rapporto precedente e i 4 siti indicati nella vecchia lista. Un
    dominio può comparire più volte.
  alternativa_ufficiale_leggibile: Una pagina o un documento dell’ente/gestore, oppure del circuito regionale, effettivamente
    leggibile. Non equivale a orario attuale confermato. Uno stesso documento può coprire più indirizzi originari.
  fonte_e_orario_ordinario_recuperati: Il caso non richiede più apertura personale per leggere l’orario ordinario;
    rimane il normale confronto periodico di avvisi e dati.
  nessuna_alternativa_utile_leggibile: Nessun contenuto leggibile sufficiente sul punto specifico, anche se esistono
    homepage o documenti di contesto.
ambito:
  gruppi_precedenti: 20
  locali_vecchia_lista: 6
  gruppi_totali: 26
  url_originari_totali: 54
  url_originari_ritentati_questa_sessione: 35
  url_precedentemente_recuperati_riportati_con_provenienza: 19
  locali_senza_url_ufficiale_verificabile: 2
riepilogo:
  accesso_dei_54_url:
    alternativa_ufficiale_leggibile: 31
    originale_leggibile: 13
    nessuna_alternativa_utile_leggibile: 10
  stati_dei_26_gruppi:
    resta_da_verificare: 21
    fonte_e_orario_ordinario_recuperati: 5
  aperture_web_questa_sessione: 99
  ricerche_nel_testo_questa_sessione: 6
  url_distinti_tentati: 90
  ricerche_web: 60
  canali_nuovi: 15
metodi:
- Nuova apertura di tutti i 31 URL residui e dei quattro siti della vecchia lista, prima delle alternative.
- Varianti pubbliche di dominio, lingua, index.php e formati di stampa; schede dell’ente e circuito regionale.
- Documenti PDF ufficiali letti nelle sezioni operative; lettura distinta da semplice metadato.
- 'Tentativi su feed RSS e API pubbliche: nessun contenuto recuperato da questi tentativi. EAV RSS restituisce formato
  non supportato dallo strumento, non un diniego del sito.'
- Browser Chromium con JavaScript tentato ma arrestato prima di navigare; curl non raggiunge il proxy configurato.
  Nessuna richiesta dal browser arrivata ai siti.
- 'Profili e prenotazioni pubbliche provati dove collegati dal sito: contenuti bloccati o JavaScript, nessun invio
  o prenotazione.'
limiti:
- Nessuna simulazione di identità umana, modifica dei segnali del browser, aggiramento CAPTCHA o uso di proxy esterni.
- Il servizio web usa anche pagine indicizzate; data del tentativo, ultima scansione e validità sono distinte.
- 'Le pagine MiC Floridiana, Virgilio e Villa Jovis hanno prodotto successi e timeout: accessibilità intermittente
  documentata.'
- 'Per ogni fonte accessibile leggere anche la nota: alcune contengono orari storici o solo contatti. Non sono recuperi
  completi degli orari attuali.'
- Le due attività senza fonte del gestore verificabile non sono sommate ai 54 indirizzi. Facebook Friggitoria è
  solo candidato di attribuzione non verificata.
